<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DQ Loop</title>
<meta name="description" content="하루 루틴을 체크하고, 달성한 만큼 스스로에게 보상하는 루틴 수첩">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DQ Loop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f2ea">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var s=JSON.parse(localStorage.getItem('myroutine_state_v1')||'{}'),t=(s.settings||{}).theme||'system';document.documentElement.dataset.theme=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f2ea;--paper:#fffdf8;--sunk:#ece8dc;--ink:#1d1c19;--ink2:#58554c;--ink3:#8c877a;--line:#e0dbcd;--line2:#c9c3b2;--accent:#1f6b4a;--on-accent:#fff;--accent-soft:#e2eee5;--bad:#b23c2a;--bad-soft:#f7e4df;--warn:#8f6416;--warn-soft:#f4ebd2;--r:10px;--sab:env(safe-area-inset-bottom,0px);color-scheme:light}
html[data-theme=dark]{--bg:#141412;--paper:#1c1b18;--sunk:#262521;--ink:#ece8dd;--ink2:#b5b0a2;--ink3:#7f7b6f;--line:#302e29;--line2:#4a473f;--accent:#7cc49c;--on-accent:#0f2118;--accent-soft:#1e2e25;--bad:#e58a78;--bad-soft:#3a211c;--warn:#d6aa55;--warn-soft:#33290f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
b,strong{font-weight:700}

/* 틀 */
#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media(min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.bar{display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 8px;flex-shrink:0;min-height:60px}
.bar h1{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-back{width:36px;height:36px;margin-left:-10px;font-size:28px;line-height:1;color:var(--ink2);border-radius:8px;text-align:center;flex-shrink:0}
#hd-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
#main{flex:1;overflow-y:auto;padding:4px 20px calc(92px + var(--sab));scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:50}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;color:var(--ink3);font-size:11px;font-weight:500;position:relative}
.nav svg{width:22px;height:22px;stroke-width:1.6}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on:before{content:'';position:absolute;top:-1px;left:50%;width:28px;margin-left:-14px;height:2px;background:var(--ink)}

/* 공통 */
svg{display:block}
.ic{display:inline-flex;width:22px;height:22px;flex-shrink:0}
.ic svg{width:100%;height:100%;stroke-width:1.7}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-h h2 small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:6px}
.lnk{font-size:13px;font-weight:600;color:var(--accent);padding:6px 0 6px 10px;white-space:nowrap}
.lnk.muted{color:var(--ink3)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
button.row-main{display:block}
.row-t{font-size:15px;font-weight:600;line-height:1.35}
.row-s{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.45}
.row-v{font-size:14px;font-weight:600;white-space:nowrap;text-align:right}
.row-ic{color:var(--ink3)}
.row.nav-row{cursor:pointer}
.row .chev{color:var(--ink3);font-size:18px;flex-shrink:0}
.pad{padding:14px}
.note{font-size:12.5px;color:var(--ink3);line-height:1.55}
.note b{color:var(--ink2);font-weight:600}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.6;padding:26px 14px}
.empty b{display:block;color:var(--ink2);font-size:14.5px;font-weight:600;margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:3px 5px;border-radius:4px;background:var(--sunk);color:var(--ink2);white-space:nowrap;vertical-align:1px}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--paper);font-size:14px;font-weight:600;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-a{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-d{color:var(--bad);border-color:var(--bad)}
.btn-s{min-height:34px;padding:0 11px;font-size:13px;border-radius:7px}
.btn-full{width:100%}
.sq{width:34px;min-height:34px;padding:0;border-radius:7px;border:1px solid var(--line2);background:var(--paper);font-size:14px;text-align:center;flex-shrink:0;color:var(--ink2)}
.more{width:32px;height:36px;margin-right:-8px;border-radius:7px;color:var(--ink3);font-size:18px;line-height:1;text-align:center;flex-shrink:0;letter-spacing:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gap{height:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{min-height:36px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink2);text-align:center}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stat{padding:13px 8px;text-align:center;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.track.met i{background:var(--ink)}
.bar-row{display:grid;grid-template-columns:minmax(52px,34%) 1fr 48px;gap:10px;align-items:center;padding:7px 0}
.bar-lbl{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-val{text-align:right;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}

/* 체크박스 */
.cb{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:17px;font-weight:700;line-height:1;position:relative}
.cb:after{content:'';position:absolute;inset:-9px}
.cb svg{width:17px;height:17px;stroke-width:2.6}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb.x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cb.z{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-size:14px}
.cb.pop svg{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.row.is-done .row-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.row.is-failed .row-t,.row.is-paused .row-t{color:var(--ink3)}
.row.is-done .row-ic,.row.is-failed .row-ic,.row.is-paused .row-ic{opacity:.45}
.late{color:var(--bad)}

/* 오늘 */
.today{padding:6px 0 2px}
.today-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.today-date{font-size:13.5px;color:var(--ink2);font-weight:500}
.modebtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;background:var(--paper)}
.modebtn .ic{width:16px;height:16px}
.today-num{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.today-num b{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1}
.today-num span{font-size:22px;font-weight:500;color:var(--ink3)}
.today-num em{margin-left:auto;font-style:normal;font-size:15px;font-weight:600;color:var(--ink2)}
.meter{display:flex;gap:3px;margin-top:14px}
.meter i{flex:1;height:8px;border-radius:2px;background:var(--sunk);min-width:3px}
.meter i.d{background:var(--accent)}
.meter i.f{background:var(--bad);opacity:.55}
.today-sub{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}
.week{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;gap:2px;margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.week-nav{color:var(--ink3);font-size:18px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:8px}
.day .dw{font-size:11px;color:var(--ink3);font-weight:500}
.day .dd{font-size:15px;font-weight:600;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%}
.day.on .dd{background:var(--ink);color:var(--bg)}
.day.tdy .dw{color:var(--accent);font-weight:700}
.day .mk{width:6px;height:6px;border-radius:50%;border:1.5px solid transparent}
.day .mk.full{background:var(--accent);border-color:var(--accent)}
.day .mk.part{border-color:var(--accent)}
.focus{margin-top:20px;background:var(--paper);border:1px solid var(--ink);border-radius:var(--r);padding:14px}
.focus-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pager{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:var(--ink3)}
.pager button{width:30px;height:30px;font-size:18px;text-align:center;color:var(--ink2);border-radius:6px}
.focus-body{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.focus-body .ic{width:26px;height:26px;margin-top:3px}
.focus-time{font-size:13px;color:var(--ink2);font-weight:500}
.focus-title{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-top:1px}
.focus-meta{font-size:12.5px;color:var(--ink3);margin-top:4px}
.focus-act{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:14px}
.clear{margin-top:20px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.clear .ic{color:var(--accent);width:26px;height:26px}
.clear b{display:block;font-size:15px}
.clear span{font-size:12.5px;color:var(--ink2)}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{transition:transform .15s}
details.fold[open]>summary .chev{transform:rotate(90deg)}

/* 달력 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.cal-title{font-size:17px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11px;color:var(--ink3);text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.05;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;border:1px solid transparent;min-width:0}
.cell .n{font-size:14px;font-weight:600}
.cell .p{font-size:10px;color:var(--ink3);line-height:1}
.cell.h1{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cell.h2{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.cell.h3{background:color-mix(in srgb,var(--accent) 46%,transparent)}
.cell.h3 .p{color:var(--ink2)}
.cell.fut .n{color:var(--ink3);font-weight:500}
.cell.tdy .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell.on{border-color:var(--ink)}
.cell .pip{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%}
.legend{display:flex;gap:12px;align-items:center;justify-content:flex-end;font-size:11.5px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.wk-nav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:14px 0 12px;text-align:center}
.wk-nav b{display:block;font-size:16px}
.wk-nav span{font-size:12.5px;color:var(--ink3)}
.review h4{font-size:12.5px;font-weight:700;color:var(--ink3);margin:14px 0 3px}
.review h4:first-child{margin-top:0}
.review p{font-size:14px;line-height:1.65;color:var(--ink)}
.chart{padding:14px;border-top:1px solid var(--line)}
.chart:first-child{border-top:0}
.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart-val{font-size:20px;font-weight:700;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.chart-delta{font-size:12px;text-align:right;color:var(--ink3)}
.chart svg{width:100%;height:auto;margin-top:8px;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.c-target{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4}
.c-txt{font-size:10px;fill:var(--ink3)}

/* 퀘스트 */
.q{display:block;width:100%;padding:14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q-title{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.q-dday{font-size:13px;font-weight:700;white-space:nowrap}
.q-meta{font-size:12px;color:var(--ink3);margin-top:3px}
.q-prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.q-prog .track{flex:1}
.q-prog b{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.q-next{font-size:13px;color:var(--ink2);margin-top:9px;padding-left:10px;border-left:2px solid var(--line2);line-height:1.5}
.q.dim{opacity:.6}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:16px;font-weight:500;color:var(--ink3);letter-spacing:0}

/* 지갑 */
.bal{padding:6px 0 16px}
.bal-k{font-size:13px;color:var(--ink2)}
.bal-v{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.15}
.bal-v small{font-size:20px;font-weight:600;margin-left:2px}
.led{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line);width:100%}
.led:first-child{border-top:0}
.led-d{font-size:12.5px;color:var(--ink3)}
.led-t{font-size:14px;font-weight:500;min-width:0}
.led-t small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.led-a{font-size:14.5px;font-weight:700;white-space:nowrap}
.led-a.plus{color:var(--accent)}
.led.void .led-a,.led.void .led-t{text-decoration:line-through;color:var(--ink3)}

/* 폼 */
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.input,.select,.textarea{width:100%;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:11px 12px;font-size:15px;outline:none;min-height:44px;-webkit-appearance:none;appearance:none}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.textarea{min-height:76px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink)}
.help{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-t{border:1px solid var(--line2);background:var(--paper);color:var(--ink2);border-radius:7px;padding:0 11px;min-height:36px;font-size:13px;font-weight:600}
.chip-t.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dowpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dowpick .chip-t{padding:0;text-align:center}
.icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:176px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper)}
.icon-pick{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.icon-pick.on{border-color:var(--ink);background:var(--sunk)}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.color-pick{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line2)}
.color-pick.on{box-shadow:0 0 0 2px var(--ink)}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;background:var(--paper)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.box-h b{font-size:14px;font-weight:600}
.box-body{margin-top:12px}
.switch{position:relative;width:44px;height:26px;display:inline-block;flex-shrink:0}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:13px;transition:.15s;pointer-events:none}
.switch span:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--paper);transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.mode-pick{border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.mode-pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode-pick b{display:block;font-size:14px;font-weight:600}
.mode-pick small{font-size:11.5px;color:var(--ink3)}
.mrow{padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.off .mrow-t{color:var(--ink3)}
.mrow-h{display:flex;align-items:center;gap:8px}
.mrow-t{flex:1;min-width:0;font-size:14px;font-weight:600}
.mrow-c{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.mrow.off .mrow-c{display:none}
.flash{animation:flash .5s}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(20,19,16,.48);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s}
.modal-bg.center{align-items:center;padding:24px;z-index:300}
.modal{width:100%;max-width:520px;background:var(--bg);border-radius:16px 16px 0 0;padding:22px 20px calc(22px + var(--sab));max-height:92dvh;overflow-y:auto;position:relative;animation:up .2s cubic-bezier(.2,.8,.2,1)}
@media(min-width:560px){.modal-bg{align-items:center;padding:24px}.modal{border-radius:14px;max-height:86dvh}}
.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;font-size:24px;line-height:1;color:var(--ink3);text-align:center;border-radius:8px}
.modal-title{font-size:20px;font-weight:700;letter-spacing:-.02em;padding-right:34px}
.modal-sub{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:4px}
.modal-body{margin-top:18px}
.acts{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.act{display:block;width:100%;padding:14px;font-size:15px;font-weight:500;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act.bad{color:var(--bad)}
.dialog{width:100%;max-width:340px;background:var(--bg);border-radius:14px;padding:22px 20px 18px;animation:up .18s}
.dialog-msg{font-size:16px;font-weight:600;line-height:1.45}
.dialog-sub{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:6px}
.dialog .grid2{margin-top:18px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(18px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,12px);z-index:500;background:var(--ink);color:var(--bg);border-radius:8px;padding:11px 16px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.stamp-wrap{position:fixed;inset:0;z-index:600;pointer-events:none;display:flex;align-items:center;justify-content:center}
.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--accent);color:var(--accent);background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);animation:stamp 1.7s ease forwards}
.stamp b{font-size:24px;font-weight:800;letter-spacing:.04em}
.stamp span{font-size:12px;font-weight:600;margin-top:2px}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(1.9)}14%{opacity:1;transform:rotate(-12deg) scale(.96)}20%{transform:rotate(-12deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:rotate(-12deg) scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:350px){#main{padding-left:14px;padding-right:14px}.bar{padding-left:14px;padding-right:14px}.today-num b{font-size:48px}.focus-act{grid-template-columns:1fr 1fr}.focus-act .btn-a{grid-column:1/3}.icon-grid{grid-template-columns:repeat(6,1fr)}}

async function transferToDQ(){const amount=walletBalance();if(amount<=0)return toast('이체할 잔고가 없습니다.');if(!state.gist.id||!state.gist.token)return toast('설정에서 Gist 정보를 저장해주세요.');const btn=document.getElementById('btn-transfer');if(btn){btn.disabled=true;btn.textContent='이체 요청 중...'}try{const data=await fetchGistData();data.routineTransfers=Array.isArray(data.routineTransfers)?data.routineTransfers:[];const entry={id:uid('dqloop'),source:'dq_loop',type:'routine_wallet_transfer',amount,currency:'KRW',status:'pending',createdAt:new Date().toISOString(),appliedAt:null,rewardedDays:deriveRewards().map(r=>r.date),memo:`DQ Loop 루틴 잔고 ${money(amount)}원 이체 요청`};data.routineTransfers.push(entry);data.dqLoopState=gistBackupState();data.dqLoopBackupMeta={version:APP_VERSION,updatedAt:new Date().toISOString(),reason:'transfer'};await patchGistData(data);state.transfers.push(entry);state.gist.lastSync=new Date().toISOString();state.gist.lastAutoBackup=new Date().toISOString();state.gist.lastAutoBackupError='';save({skipAutoSync:true});toast(`${money(amount)}원 DQ 이체 요청 완료`);render()}catch(e){toast('이체 실패: '+e.message);if(btn){btn.disabled=false;btn.textContent='DQ로 이체 요청'}}}
async function syncTransferStatus(){if(!state.gist.id||!state.gist.token)return toast('Gist 정보를 저장해주세요.');try{const data=await fetchGistData();const remote=Array.isArray(data.routineTransfers)?data.routineTransfers:[];state.transfers=state.transfers.map(t=>{const f=remote.find(r=>r.id===t.id);return f?Object.assign({},t,{status:f.status||t.status,appliedAt:f.appliedAt||t.appliedAt,remoteCheckedAt:new Date().toISOString()}):t});state.gist.lastSync=new Date().toISOString();save();toast('DQ 반영 상태를 확인했습니다.');render()}catch(e){toast('상태 확인 실패: '+e.message)}}
async function patchGistData(data){const file=state.gist.fileName||'dq-backup.json';const res=await fetch(`https://api.github.com/gists/${state.gist.id}`,{method:'PATCH',headers:{Authorization:`token ${state.gist.token}`,Accept:'application/vnd.github.v3+json'},body:JSON.stringify({files:{[file]:{content:JSON.stringify(data,null,2)}}})});if(!res.ok)throw new Error('Gist 저장 실패')}
function extractDqLoopStateFromGistData(data){if(data?.dqLoopState?.routines&&data?.dqLoopState?.completions)return data.dqLoopState;if(data?.routines&&data?.completions)return data;throw new Error('DQ Loop 백업 데이터가 없습니다.')}

/* ===================== 계산 (캐시 적용) ===================== */
function routineLive(r,date){if(r.startDate&&date<r.startDate)return false;if(r.active!==false)return true;return !!(r.endedOn&&date<=r.endedOn)}
function scheduledRoutines(date){return cached('sr'+date,()=>{const modeId=modeForDate(date),dow=parseDate(date).getDay();return state.routines.filter(r=>routineLive(r,date)).filter(r=>{if(!(r.weekdays||[0,1,2,3,4,5,6]).includes(dow))return false;const cfg=(r.modeConfig||{})[modeId];return cfg?cfg.enabled!==false:true}).sort(routineOrderComparator(date))})}
function getRate(date){return cached('rate'+date,()=>{if(date<firstDataDate())return {done:0,failed:0,total:0,pct:0,paused:0};const list=activeRoutines(date);const done=list.filter(r=>isDone(date,r.id)).length;const failed=list.filter(r=>isFailed(date,r.id)).length;return {done,failed,total:list.length,pct:list.length?Math.round(done/list.length*100):0,paused:pausedRoutines(date).length}})}
function firstDataDate(){return cached('first',()=>{const t=today();const keys=Object.keys(state.completions||{}).concat(Object.keys(state.instants||{})).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();return keys.length&&keys[0]<t?keys[0]:t})}
function deriveRewards(){return cached('rewards',()=>{
 const t=today(),dates=getDateRange(firstDataDate(),t);
 const out=dates.map(calcDayReward).filter(r=>r.amount>0);
 const extra=[],weekly={};
 out.forEach(r=>{const w=weekStart(r.date);(weekly[w]=weekly[w]||[]).push(r.date)});
 const wb=Number(state.settings.weeklyBonus||0);
 if(wb>0)Object.entries(weekly).forEach(([w,ds])=>{if(ds.length>=5){ds.sort();extra.push({id:'weekly_'+w,date:ds[ds.length-1],amount:wb,parts:['주간 5일 이상 달성'],rate:100,modeId:'weekly'})}});
 const sb=Number(state.settings.streakBonus7||0),from=state.settings.streakBonusFrom||t;
 if(sb>0){let run=0;dates.forEach(d=>{if(d<from)return;const r=getRate(d);if(!r.total)return;if(r.pct===100){run++;if(run%7===0)extra.push({id:'streak_'+d,date:d,amount:sb,parts:[run+'일 연속 달성'],rate:100,modeId:'streak'})}else if(d!==t)run=0})}
 Object.keys(state.instants||{}).forEach(d=>{instantsFor(d).filter(x=>x.done&&Number(x.reward)>0).forEach(x=>extra.push({id:'inst_'+x.id,date:d,amount:Number(x.reward),parts:[x.title],rate:100,modeId:'instant'}))});
 return out.concat(extra).map(r=>Object.assign({id:r.id||('reward_'+r.date)},r))})}
function streakTo(date=today()){const min=firstDataDate();let s=0,d=date;if(d===today()&&getRate(d).pct<100)d=addDays(d,-1);for(let i=0;i<2000&&d>=min;i++){const r=getRate(d);if(r.total){if(r.pct<100)break;s++}d=addDays(d,-1)}return s}

function timeShort(t){const n=normalizeTime(t);if(!n)return'';const [h,m]=n.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`}
function dateLabel(d){const x=parseDate(d);return `${x.getMonth()+1}월 ${x.getDate()}일 ${DOW[x.getDay()]}요일`}
function md(d){const x=parseDate(d);return `${x.getMonth()+1}/${x.getDate()}`}
function dowText(r){const w=r.weekdays||[];if(w.length===7)return'매일';if(w.length===5&&[1,2,3,4,5].every(i=>w.includes(i)))return'평일';if(w.length===2&&w.includes(0)&&w.includes(6))return'주말';return [1,2,3,4,5,6,0].filter(i=>w.includes(i)).map(i=>DOW[i]).join('·')}

function routineBits(r,date){const bits=[],t=timeShort(routineTime(r,date));if(t)bits.push(t);if(r.importance==='core')bits.push('핵심');if(hasNumberTrack(r)){const cfg=numericConfig(r),rec=getNumberRecord(date,r.id);bits.push(esc(cfg.label)+' '+(rec?esc(formatMetricValue(rec,cfg)):'기록 전'))}if(hasWeeklyCount(r)){const w=weeklyCountProgress(r,date);bits.push(`이번 주 ${w.count}/${w.target}회`)}if(modeConfig(r,modeForDate(date)).rewardEligible===false)bits.push('보상 제외');return bits}

function metricSvg(points,cfg){
 const w=320,h=120,pl=4,pr=4,pt=10,pb=22;

 if(Number.isFinite(target)){min=Math.min(min,target);max=Math.max(max,target)}if(min===max){min-=1;max+=1}
 const span=max-min,x=i=>points.length===1?w/2:pl+(i/(points.length-1))*(w-pl-pr),y=v=>pt+(max-v)/span*(h-pt-pb);
 const unit=cfg.unit?' '+cfg.unit:'';
 const line=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.value).toFixed(1)).join(' ');

 const rows=deriveRewards().map(r=>({date:r.date,title:r.parts.join(', '),sub:r.modeId==='instant'?'할 일 보상':r.modeId==='weekly'?'주간 보너스':r.modeId==='streak'?'연속 달성 보너스':(state.routineModes.find(m=>m.id===r.modeId)?.name||'루틴 보상'),amt:r.amount,plus:true}))
  .concat((state.transfers||[]).map(t=>({date:String(t.createdAt||'').slice(0,10),title:t.type==='spend'?(t.memo||'보상 사용'):'본앱으로 이체',sub:statusLabel(t),amt:t.amount,plus:false,void:t.status==='failed',id:t.id,spend:t.type==='spend'})))
  .sort((a,b)=>b.date.localeCompare(a.date));
 const limit=ui.ledgerMore?rows.length:30,shown=rows.slice(0,limit);
 const led=shown.map(x=>{const inner=`<span class="led-d">${md(x.date)}</span><span class="led-t">${esc(x.title)}<small>${esc(x.sub)}</small></span><span class="led-a ${x.plus?'plus':''}">${x.plus?'+':'−'}${money(x.amt)}</span>`;return x.spend?`<button class="led" data-a="del-spend" data-id="${x.id}" aria-label="${esc(x.title)} 사용 기록">${inner}</button>`:`<div class="led ${x.void?'void':''}">${inner}</div>`}).join('');
 const html=`<section class="bal"><div class="bal-k">쓸 수 있는 보상</div><div class="bal-v">${money(bal)}<small>원</small></div><div class="grid2" style="margin-top:14px"><button class="btn btn-p" data-a="spend" ${bal<=0?'disabled':''}>보상 사용하기</button>${hasGistConfig()?`<button class="btn" id="btn-transfer" data-a="transfer" ${bal<=0?'disabled':''}>본앱으로 이체</button>`:`<button class="btn" data-a="how-reward">보상 규칙 보기</button>`}</div></section><div class="stats">${stat(money(earned),'지금까지 적립')}${stat(money(used),'사용·이체')}${stat(money(pending),'이체 대기')}</div>${hasGistConfig()&&pending>0?`<div style="margin-top:8px;text-align:right"><button class="lnk" data-a="sync-transfer">이체 반영 상태 확인</button></div>`:''}`+
 sec('내역','',`<div class="sheet">${led||'<div class="empty"><b>아직 내역이 없습니다</b>하루 루틴을 80% 이상 마치면 보상이 쌓이기 시작합니다.</div>'}</div>${rows.length>limit?`<div class="gap"></div><button class="btn btn-full" data-a="ledger-more">전체 ${rows.length}건 보기</button>`:''}`,rows.length?rows.length+'건':'');
 return {title:'지갑',html}}

function setModes(){
 const html=`<p class="note" style="margin-bottom:10px">모드는 그날 상황에 맞춘 루틴 묶음입니다. 바쁜 날이나 아픈 날에는 가벼운 모드로 바꿔 흐름을 지키세요.</p><div class="sheet">${state.routineModes.map(m=>{const n=state.routines.filter(r=>r.active!==false&&modeConfig(r,m.id).enabled!==false).length;return `<div class="row">${ic(m.iconKey,m.color)}<button class="row-main" data-a="edit-mode" data-id="${m.id}"><div class="row-t">${esc(m.name)}${m.isDefault?' <span class="tag ok">기본</span>':''}</div><div class="row-s">루틴 ${n}개 · 전부 완료 ${money(m.fullReward)}원 · 80% ${money(m.partialReward)}원</div></button><button class="btn btn-s" data-a="mode-routines" data-id="${m.id}">루틴 구성</button></div>`}).join('')}</div>`+
 sec('요일별 기본 모드','',`<div class="sheet">${[1,2,3,4,5,6,0].map(i=>`<div class="row"><div class="row-main"><div class="row-t">${DOW[i]}요일</div></div><select class="select" style="width:auto;min-width:140px" data-c="weekday-mode" data-dow="${i}" aria-label="${DOW[i]}요일 모드"><option value="">기본 모드</option>${state.routineModes.map(m=>`<option value="${m.id}" ${state.weekdayModeDefaults[i]===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`).join('')}</div><p class="note" style="margin-top:10px">특정 날짜만 바꾸려면 오늘 화면이나 달력에서 모드 이름을 누르세요.</p>`);
 return {title:'모드',back:'set-root',right:`<button class="btn btn-s" data-a="add-mode">새 모드</button>`,html}}
function setRules(){
 const s=state.settings,now=(state.routinePauses||[]).filter(p=>!p.endedAt&&today()<=p.endDate);
 const num=(id,label,val,help)=>`<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" type="number" inputmode="numeric" min="0" value="${Number(val)}">${help?`<div class="help">${help}</div>`:''}</div>`;
 const html=`<p class="note" style="margin-bottom:12px">하루 보상 금액은 <b>모드</b>마다 따로 정합니다. 여기서는 보너스와 휴식 규칙을 정합니다.</p>`+
 `<div class="sheet pad">${num('rule-streak','7일 연속 달성 보너스 (원)',s.streakBonus7,'모든 루틴을 마친 날이 7일 이어질 때마다 지급합니다. 0이면 지급하지 않습니다.')}${num('rule-weekly','주간 보너스 (원)',s.weeklyBonus,'한 주에 보상받은 날이 5일 이상이면 지급합니다.')}${num('rule-allow','주간 휴식 기준 (회)',s.pauseWeeklyAllowance,'이 횟수를 넘으면 리포트에서 루틴 조정을 권합니다.')}${num('rule-recover','회복일 보상 (원)',s.pauseRecoveryReward,'')}${num('rule-ratio','정상 보상 최소 비율 (%)',s.pauseMinActiveRatio,'휴식으로 빠진 루틴이 많아 남은 루틴이 이 비율보다 적으면, 그날은 회복일 보상만 지급합니다.')}<div class="field"><label for="rule-display">쉬는 중인 루틴 표시</label><select class="select" id="rule-display"><option value="collapsed" ${s.pauseDisplay==='collapsed'?'selected':''}>접어서 보기</option><option value="gray" ${s.pauseDisplay==='gray'?'selected':''}>흐리게 펼쳐 보기</option><option value="hidden" ${s.pauseDisplay==='hidden'?'selected':''}>숨기기</option></select></div><button class="btn btn-p btn-full" data-a="save-rules">저장</button></div>`+
 sec('지금 쉬는 중','',`<div class="sheet">${now.length?now.map(p=>{const r=state.routines.find(x=>x.id===p.routineId);return `<div class="row"><div class="row-main"><div class="row-t">${esc(r?.title||'삭제된 루틴')}</div><div class="row-s">${esc(p.reason||'기타')} · ${md(p.startDate)} ~ ${md(p.endDate)}</div></div><button class="btn btn-s" data-a="end-pause" data-pid="${p.id}">복귀</button></div>`}).join(''):'<div class="pad note">쉬는 중인 루틴이 없습니다.</div>'}</div>`,now.length?now.length+'개':'');
 return {title:'보상과 휴식 규칙',back:'set-root',html}}
function setBackup(){
 const g=state.gist,err=g.lastAutoBackupError,last=g.lastAutoBackup||g.lastSync;
 const status=!hasGistConfig()?'연결 안 됨':err?`<span class="late">오류: ${esc(err)}</span>`:last?'마지막 백업 '+new Date(last).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'연결됨';
 const html=sec('파일로 보관','',`<div class="sheet pad"><p class="note" style="margin-bottom:12px">모든 기록을 파일 하나로 저장하거나, 저장해둔 파일에서 되살립니다. 기기를 바꿀 때 사용하세요.</p><div class="grid2"><button class="btn" data-a="export">파일로 내보내기</button><button class="btn" data-a="import">파일에서 가져오기</button></div></div>`)+
 sec('GitHub Gist 자동 백업','',`<div class="sheet pad"><p class="note" style="margin-bottom:12px">내 GitHub Gist에 기록을 자동으로 올려 여러 기기에서 이어서 씁니다. 선택 사항이며, 토큰은 이 기기에만 저장되고 백업 파일에는 포함되지 않습니다.</p><div class="field"><label for="gist-id">Gist ID</label><input class="input" id="gist-id" value="${esc(g.id)}" autocomplete="off" spellcheck="false"></div><div class="field"><label for="gist-token">Personal Access Token (gist 권한)</label><input class="input" id="gist-token" type="password" value="${esc(g.token)}" autocomplete="off"></div><div class="field"><label for="gist-file">파일 이름</label><input class="input" id="gist-file" value="${esc(g.fileName||'dq-backup.json')}" autocomplete="off" spellcheck="false"></div><div class="box-h" style="margin-bottom:14px"><b style="font-size:14px;font-weight:600">바뀔 때마다 자동 백업</b><label class="switch"><input type="checkbox" id="gist-auto-sw" data-c="gist-auto" ${g.autoBackup!==false?'checked':''}><span></span></label></div><button class="btn btn-p btn-full" data-a="gist-save">연결 저장</button><div class="gap"></div><div class="grid2"><button class="btn" data-a="gist-load">Gist에서 불러오기</button><button class="btn" data-a="gist-backup">지금 백업</button></div><div class="row-s" style="margin-top:12px">상태 · ${status}</div></div>`);
 return {title:'백업과 동기화',back:'set-root',html}}

/* ===================== 렌더 ===================== */
function render(){
 C={};const t=today();if(ui.lastDay!==t){if(ui.homeDate===ui.lastDay)ui.homeDate=t;ui.lastDay=t}
 document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.tab===ui.tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const v=ui.tab==='home'?viewHome():ui.tab==='records'?viewRecords():ui.tab==='quests'?viewQuests():ui.tab==='wallet'?viewWallet():viewSettings();
 $('page-title').textContent=v.title;ui.back=v.back||'';$('hd-back').classList.toggle('hidden',!v.back);$('hd-right').innerHTML=v.right||'';
 const main=$('main'),key=[ui.tab,ui.recView,ui.questId,ui.setView].join('|');main.innerHTML=v.html;if(ui.viewKey!==key){main.scrollTop=0;ui.viewKey=key}
 if(briefingDue())openWeeklyBriefingGate();else if(!state.settings.onboarded)openOnboarding()}

/* ===================== 모달 공통 ===================== */
function showModal(html,options={}){modalLocked=!!options.locked;const root=$('modal-root');root.innerHTML=`<div class="modal-bg ${options.className||''}"><div class="modal" role="dialog" aria-modal="true">${options.locked?'':'<button class="modal-x" data-a="close" aria-label="닫기">×</button>'}${html}</div></div>`;root.querySelector('.modal-bg').addEventListener('mousedown',e=>{if(e.target.classList.contains('modal-bg')&&!modalLocked)closeModal()})}
function closeModal(force=false){if(modalLocked&&force!==true)return;$('modal-root').innerHTML='';modalLocked=false}
function mhead(t,s){return `<h2 class="modal-title">${t}</h2>${s?`<p class="modal-sub">${s}</p>`:''}<div class="modal-body">`}
function mfoot(saveId,saveLabel,delId,delLabel,cls='btn-p'){return `<div class="gap"></div><div class="grid2"><button class="btn" data-a="close">취소</button><button class="btn ${cls}" id="${saveId}">${saveLabel}</button></div>${delId?`<div class="gap"></div><button class="btn btn-d btn-full" id="${delId}">${delLabel}</button>`:''}</div>`}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function ask(msg,opt={}){return new Promise(res=>{const root=$('confirm-root');root.innerHTML=`<div class="modal-bg center"><div class="dialog" role="alertdialog" aria-modal="true"><p class="dialog-msg">${esc(msg)}</p>${opt.detail?`<p class="dialog-sub">${esc(opt.detail)}</p>`:''}<div class="grid2"><button class="btn" id="ask-no">${esc(opt.no||'취소')}</button><button class="btn ${opt.danger?'btn-d':'btn-p'}" id="ask-yes">${esc(opt.ok||'확인')}</button></div></div></div>`;const done=v=>{root.innerHTML='';res(v)};$('ask-no').onclick=()=>done(false);$('ask-yes').onclick=()=>done(true);$('ask-yes').focus()})}
function pickOne(selector,attr,initial){let sel=initial;document.querySelectorAll(selector).forEach(b=>b.onclick=()=>{sel=b.dataset[attr];document.querySelectorAll(selector).forEach(x=>x.classList.toggle('on',x===b))});return ()=>sel}
function iconPicker(selIcon,selColor){return `<div class="icon-grid" id="icon-grid">${ICON_LIBRARY.map(([k,n,c])=>`<button type="button" class="icon-pick ${selIcon===k?'on':''}" data-icon="${k}" data-color="${c}" title="${n}" aria-label="${n}">${svg(k)}</button>`).join('')}</div><div class="colors" id="color-row">${Object.keys(COLORS).map(c=>`<button type="button" class="color-pick ${selColor===c?'on':''}" data-pcolor="${c}" style="background:${COLORS[c][0]}" aria-label="색 ${c}"></button>`).join('')}</div>`}
function bindIconPicker(icon,color){const s={icon,color};const grid=$('icon-grid');grid.querySelectorAll('.icon-pick svg').forEach(x=>{x.style.width='22px';x.style.height='22px';x.style.strokeWidth='1.7'});const paint=()=>{grid.style.color=(COLORS[s.color]||COLORS.slate)[0]};paint();grid.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{s.icon=b.dataset.icon;grid.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelectorAll('[data-pcolor]').forEach(b=>b.onclick=()=>{s.color=b.dataset.pcolor;document.querySelectorAll('[data-pcolor]').forEach(x=>x.classList.toggle('on',x===b));paint()});const on=grid.querySelector('.on');if(on)grid.scrollTop=Math.max(0,on.offsetTop-grid.offsetTop-60);return s}
function reasonChips(list,sel,attr){return `<div class="chips">${list.map(x=>`<button type="button" class="chip-t ${sel===x?'on':''}" data-${attr}="${x}">${x}</button>`).join('')}</div>`}
function sw(id,on){return `<label class="switch"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></label>`}

/* ===================== 완료 처리 ===================== */
function completionFeedback(r,date){const rate=getRate(date);try{if(navigator.vibrate)navigator.vibrate(rate.pct>=100?[30,40,60]:25)}catch(e){}if(rate.total&&rate.pct>=100&&!rate.failed){const reward=calcDayReward(date);const w=document.createElement('div');w.className='stamp-wrap';w.innerHTML=`<div class="stamp"><b>전부 완료</b><span>${md(date)}${reward.amount?' · +'+money(reward.amount)+'원':''}</span></div>`;document.body.appendChild(w);setTimeout(()=>w.remove(),1750)}else toast(`${r?.title||'루틴'} 완료 · ${rate.done}/${rate.total}`)}
function completeRoutine(date,id){const r=state.routines.find(x=>x.id===id);if(!r)return;if(isDone(date,id))return;if(hasNumberTrack(r)&&!getNumberRecord(date,id)){openNumberRecord(date,id,true);return}markRoutineDone(date,id);save();const list=deckPendingRoutines(date);ui.deckIndex=Math.min(Number(ui.deckIndex||0),Math.max(0,list.length-1));closeModal();render();completionFeedback(r,date)}
function toggleRoutine(date,id){if(isDone(date,id)){const d=dayObj(date);d.done=d.done.filter(x=>x!==id);save();render();toast('완료 표시를 취소했습니다.');return}completeRoutine(date,id)}
function openNumberRecord(date,id,markDone){
 const r=state.routines.find(x=>x.id===id);if(!r)return;const cfg=numericConfig(r),old=getNumberRecord(date,id)||{};

async function fetchGistData(){
 const res=await fetch(`https://api.github.com/gists/${encodeURIComponent(state.gist.id)}`,{headers:{Authorization:`token ${state.gist.token}`,Accept:'application/vnd.github+json'},cache:'no-store'});
 if(res.status===401)throw new Error('토큰이 올바르지 않습니다');if(res.status===403)throw new Error('토큰 권한 또는 요청 한도를 확인해주세요');if(res.status===404)throw new Error('Gist를 찾을 수 없습니다');if(!res.ok)throw new Error('Gist를 불러올 수 없습니다');
 const gist=await res.json(),f=gist.files?.[state.gist.fileName||'dq-backup.json']||gist.files?.['dq-backup.json'];if(!f)return {routineTransfers:[]};
 let content=f.content;if(f.truncated&&f.raw_url){const r2=await fetch(f.raw_url);if(!r2.ok)throw new Error('Gist 파일을 불러올 수 없습니다');content=await r2.text()}
 try{return JSON.parse(content||'{}')}catch(e){throw new Error('Gist 파일 형식이 올바르지 않습니다')}}
function adoptState(remote,gistConfig){const next=normalizeStateX(JSON.parse(JSON.stringify(remote)));next.gist=Object.assign({},next.gist||{},gistConfig,{lastSync:new Date().toISOString(),lastAutoBackupError:''});next.settings.onboarded=true;state=next;C={};persistLocal();applyTheme()}
function dayCount(s){return Object.keys((s&&s.completions)||{}).filter(d=>{const c=s.completions[d];return c&&((c.done||[]).length||Object.keys(c.failed||{}).length)}).length}
async function saveGistConfig(){
 refreshGistConfigFromInputs();state.gist.autoBackup=$('gist-auto-sw')?$('gist-auto-sw').checked:state.gist.autoBackup;save({skipAutoSync:true});
 if(!hasGistConfig()){toast('Gist ID와 토큰을 모두 입력해주세요.');return render()}
 try{const data=await fetchGistData(),remote=data&&data.dqLoopState;
  if(remote&&remote.routines&&remote.completions&&dayCount(remote)>dayCount(state)){if(await ask('Gist에 더 많은 기록이 있습니다. 불러올까요?',{detail:`Gist ${dayCount(remote)}일 · 이 기기 ${dayCount(state)}일. 불러오면 이 기기의 기록이 Gist 내용으로 바뀝니다.`,ok:'불러오기',no:'아니요'})){adoptState(remote,Object.assign({},state.gist));toast('Gist 백업을 불러왔습니다.');return render()}if(!(await ask('이 기기의 기록으로 Gist를 덮어쓸까요?',{detail:'Gist에 있던 더 많은 기록은 사라집니다.',ok:'덮어쓰기',danger:true}))){state.gist.autoBackup=false;save({skipAutoSync:true});toast('자동 백업을 꺼두었습니다.');return render()}}
  toast('연결했습니다.');await backupStateToGist(true)}catch(e){state.gist.lastAutoBackupError=e.message||String(e);persistLocal();toast('연결 실패: '+state.gist.lastAutoBackupError)}
 render()}
async function loadStateFromGist(){
 refreshGistConfigFromInputs();if(!hasGistConfig())return toast('Gist ID와 토큰을 입력해주세요.');
 if(!(await ask('Gist 백업을 불러올까요?',{detail:'이 기기의 현재 기록이 Gist 내용으로 바뀝니다.',ok:'불러오기'})))return;
 try{const data=await fetchGistData();adoptState(extractDqLoopStateFromGistData(data),Object.assign({},state.gist));toast('Gist 백업을 불러왔습니다.')}catch(e){state.gist.lastAutoBackupError=e.message||String(e);persistLocal();toast('불러오기 실패: '+state.gist.lastAutoBackupError)}
 render()}
function exportJson(){const blob=new Blob([JSON.stringify(gistBackupState(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dq-loop-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('백업 파일을 저장했습니다.')}
function importJsonFile(file){const reader=new FileReader();reader.onload=async()=>{try{let data=JSON.parse(reader.result);if(data&&data.dqLoopState)data=data.dqLoopState;if(!data||!Array.isArray(data.routines)||!data.completions)throw new Error('DQ Loop 백업 파일이 아닙니다');if(!(await ask('이 파일의 기록으로 바꿀까요?',{detail:`파일에는 ${dayCount(data)}일의 기록이 있습니다. 이 기기의 현재 기록은 사라집니다.`,ok:'가져오기'})))return;const keep=Object.assign({},state.gist);const next=normalizeStateX(data);if(!next.gist.token){next.gist.token=keep.token;if(!next.gist.id)next.gist.id=keep.id}next.settings.onboarded=true;state=next;save({skipAutoSync:true});applyTheme();toast('백업을 가져왔습니다.');render()}catch(e){toast('가져오기 실패: '+(e.message||e))}};reader.readAsText(file)}

/* ===================== 동작 연결 ===================== */
const A={
 tab(d){if(ui.tab===d.tab){if(d.tab==='quests')ui.questId='';if(d.tab==='settings')ui.setView='root';if(d.tab==='home')ui.homeDate=today();ui.viewKey=''}ui.tab=d.tab;render()},
 back(){if(ui.back==='quest-list')ui.questId='';if(ui.back==='set-root')ui.setView='root';render()},
 close(){closeModal()},
 'go-today'(){ui.homeDate=today();ui.deckIndex=0;render()},
 'home-date'(d){ui.homeDate=d.date;ui.deckIndex=0;render()},
 'home-week'(d){ui.homeDate=addDays(ui.homeDate,7*Number(d.dir));ui.deckIndex=0;render()},
 'mode-date'(d){openModeDateModal(d.date)},
 deck(d){const n=deckPendingRoutines(ui.homeDate).length;if(n){ui.deckIndex=(Number(ui.deckIndex||0)+Number(d.dir)+n)%n;render()}},
 complete(d){completeRoutine(d.date,d.id)},
 toggle(d){toggleRoutine(d.date,d.id)},
 fail(d){openFailure(d.date,d.id)},
 unfail(d){delete dayObj(d.date).failed[d.id];save();closeModal();toast('실패 기록을 취소했습니다.');render()},
 pause(d){openPauseModal(d.date,d.id)},
 'edit-pause'(d){const p=(state.routinePauses||[]).find(x=>x.id===d.pid);if(p)openPauseModal(p.startDate,p.routineId,p.id)},
 'end-pause'(d){closeModal();endPause(d.pid)},
 number(d){openNumberRecord(d.date,d.id,false)},
 move(d){const scope=d.scope?activeRoutines(d.scope).map(r=>r.id):orderedRoutines().map(r=>r.id);if(moveRoutineInScope(d.id,Number(d.dir),scope)){save();closeModal();render()}else toast('더 이동할 수 없습니다.')},
 'menu-routine'(d){openRoutineMenu(d.date,d.id)},
 'add-routine'(){openRoutineModal('new')},
 'edit-routine'(d){openRoutineModal(d.id)},
 'add-instant'(d){openInstantModal(d.date)},
 'menu-instant'(d){openInstantMenu(d.date,d.id)},
 'edit-instant'(d){openInstantModal(d.date,d.id)},
 'postpone-instant'(d){openPostponeInstantModal(d.date,d.id)},
 async 'del-instant'(d){const it=instantById(d.date,d.id);if(!it)return;if(!(await ask(`'${it.title}'을(를) 삭제할까요?`,{ok:'삭제',danger:true})))return;deleteInstant(d.date,d.id);save();closeModal();toast('삭제했습니다.');render()},
 'toggle-instant'(d){const it=toggleInstant(d.date,d.id);if(!it)return;save();render();if(it.done){try{if(navigator.vibrate)navigator.vibrate(25)}catch(e){}toast(it.reward>0?`완료 · +${money(it.reward)}원`:'완료했습니다.')}},
 'rec-view'(d){ui.recView=d.v;render()},
 'cal-month'(d){ui.calendarMonth=new Date(ui.calendarMonth.getFullYear(),ui.calendarMonth.getMonth()+Number(d.dir),1);render()},
 'rec-date'(d){ui.recordDate=d.date;render()},
 'bulk-fail'(){openBulkFailureModal()},
 async 'del-bulk'(d){const e=(state.bulkFailurePeriods||[]).find(x=>x.id===d.id);if(!e)return;if(!(await ask(`${md(e.startDate)} ~ ${md(e.endDate)} 실패 정리를 되돌릴까요?`,{detail:'이때 한 번에 등록한 실패 기록만 지워집니다.',ok:'되돌리기'})))return;const n=deleteBulkFailurePeriod(d.id);save();toast(`${n}개 실패 기록을 되돌렸습니다.`);render()},
 'report-week'(d){const next=addDays(ui.reportWeekStart||weekStart(today()),7*Number(d.dir));if(next<=weekStart(today())){ui.reportWeekStart=next;render()}},
 'report-now'(){ui.reportWeekStart=weekStart(today());render()},
 'copy-review'(){copyText(lastWeeklyReviewText).then(()=>toast('주간 회고를 복사했습니다.')).catch(()=>toast('복사하지 못했습니다.'))},
 'quest-open'(d){ui.questId=d.id;render()},
 'quest-add'(){openQuestModal('new')},
 'quest-edit'(d){openQuestModal(d.id)},
 'quest-progress'(d){const q=(state.quests||[]).find(x=>x.id===d.id);if(!q)return;q.progress=clamp(Number(q.progress||0)+Number(d.step),0,100);q.updatedAt=new Date().toISOString();save();render()},
 'quest-achieve'(d){const q=(state.quests||[]).find(x=>x.id===d.id);if(!q)return;q.totalAchieved=Math.max(0,Math.round(Number(q.totalAchieved||0)+Number(d.step)));q.updatedAt=new Date().toISOString();save();render()},
 spend(){openSpendModal()},
 'how-reward'(){openRewardRules()},
 async 'del-spend'(d){const t=(state.transfers||[]).find(x=>x.id===d.id);if(!t)return;if(!(await ask(`${money(t.amount)}원 사용 기록을 지울까요?`,{detail:'지우면 금액이 지갑으로 돌아옵니다.',ok:'지우기',danger:true})))return;state.transfers=state.transfers.filter(x=>x.id!==d.id);save();toast('사용 기록을 지웠습니다.');render()},
 async transfer(){const amt=walletBalance();if(amt<=0)return toast('이체할 금액이 없습니다.');if(await ask(`${money(amt)}원을 본앱으로 이체 요청할까요?`,{detail:'Gist를 통해 DQ 본앱에 전달됩니다.',ok:'이체 요청'}))transferToDQ()},
 'sync-transfer'(){syncTransferStatus()},
 'ledger-more'(){ui.ledgerMore=true;render()},
 'set-view'(d){ui.setView=d.v;render()},
 theme(d){state.settings.theme=d.v;save();applyTheme();render()},
 'order-mode'(d){if(d.v==='time')resetRoutineOrderByTime();else state.settings.routineOrderMode='manual';save();render()},
 'add-mode'(){openModeModal('new')},
 'edit-mode'(d){openModeModal(d.id)},
 'mode-routines'(d){openModeRoutineManager(d.id)},
 'save-rules'(){const s=state.settings,n=(id,def)=>{const v=Number($(id).value);return Number.isFinite(v)&&v>=0?v:def};s.streakBonus7=n('rule-streak',0);s.weeklyBonus=n('rule-weekly',0);s.pauseWeeklyAllowance=n('rule-allow',3);s.pauseRecoveryReward=n('rule-recover',0);s.pauseMinActiveRatio=clamp(n('rule-ratio',50),0,100);s.pauseDisplay=$('rule-display').value;save();toast('규칙을 저장했습니다.');render()},
 'gist-save'(){saveGistConfig()},
 'gist-load'(){loadStateFromGist()},
 'gist-backup'(){refreshGistConfigFromInputs();backupStateToGist(true)},
 export(){exportJson()},
 import(){$('import-file').click()},
 async 'restore-samples'(){if(!(await ask('루틴 목록을 샘플로 바꿀까요?',{detail:'지금 등록한 루틴이 샘플 루틴으로 교체됩니다. 완료 기록은 남지만 지난 달성률이 달라질 수 있습니다.',ok:'바꾸기',danger:true})))return;state.routines=cloneDefaultRoutines().map((r,i)=>normalizeRoutine(Object.assign(r,{startDate:today()}),i));resetRoutineOrderByTime();save();toast('샘플 루틴을 불러왔습니다.');render()},
 async reset(){if(!(await ask('모든 데이터를 지울까요?',{detail:'루틴, 기록, 지갑, 퀘스트가 모두 사라지며 되돌릴 수 없습니다. 먼저 파일로 내보내 두는 것을 권합니다.',ok:'모두 지우기',danger:true})))return;localStorage.removeItem(KEY);state=loadState();C={};persistLocal();ui.tab='home';ui.setView='root';ui.questId='';applyTheme();render()}
};
const CH={
 active(el){const r=state.routines.find(x=>x.id===el.dataset.id);if(!r)return;r.active=el.checked;if(r.active)delete r.endedOn;else r.endedOn=addDays(today(),-1);save();toast(r.active?'루틴을 다시 켰습니다.':'루틴을 껐습니다. 지난 기록은 남습니다.');render()},
 'weekday-mode'(el){if(el.value)state.weekdayModeDefaults[el.dataset.dow]=el.value;else delete state.weekdayModeDefaults[el.dataset.dow];save();toast(DOW[el.dataset.dow]+'요일 모드를 바꿨습니다.')},
 'gist-auto'(el){state.gist.autoBackup=el.checked;save({skipAutoSync:true})}
};
function bind(){
 document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const fn=A[b.dataset.a];if(fn)fn(b.dataset,b)});
 document.body.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CH[el.dataset.c])CH[el.dataset.c](el)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('confirm-root').innerHTML){const n=$('ask-no');if(n)n.click()}else closeModal()}});
 $('import-file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJsonFile(f);e.target.value=''});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('modal-root').innerHTML)render()});
 try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
 setInterval(()=>{if(!document.hidden&&ui.tab==='home'&&!$('modal-root').innerHTML&&!$('confirm-root').innerHTML)render()},5*60*1000)}

/* ===================== 시작 ===================== */
let state=loadState();
let ui={tab:'home',homeDate:today(),recordDate:today(),calendarMonth:new Date(),deckIndex:0,recView:'calendar',reportWeekStart:weekStart(today()),questId:'',setView:'root',lastDay:today(),ledgerMore:false,back:'',viewKey:''};
document.querySelectorAll('[data-nav-icon]').forEach(el=>{el.innerHTML=svg(el.dataset.navIcon)});
applyTheme();bind();save({skipAutoSync:true});render();
if(state.migratedFromOld){delete state.migratedFromOld;save({skipAutoSync:true})}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
