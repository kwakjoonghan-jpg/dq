.mode-card{display:flex;align-items:center;gap:12px}.mode-icon{width:48px;height:48px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--m1,#3182f6),var(--m2,#7c3aed));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 18px rgba(49,130,246,.22)}.mode-icon svg{width:25px;height:25px}.mode-body{flex:1;min-width:0}.mode-name{font-size:17px;font-weight:900}.mode-desc{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.35}.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:#4b5565;background:#f1f4f8;border:1px solid #e4e9f0;border-radius:999px;padding:4px 8px}.chip.blue{color:#2368d9;background:rgba(49,130,246,.1);border-color:rgba(49,130,246,.15)}.chip.green{color:#008c61;background:rgba(0,185,119,.1);border-color:rgba(0,185,119,.15)}.chip.red{color:#d92d3e;background:rgba(240,68,82,.1);border-color:rgba(240,68,82,.16)}.chip.yellow{color:#b97800;background:rgba(246,166,9,.12);border-color:rgba(246,166,9,.18)}.chip.purple{color:#6d28d9;background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.15)}

.next-box{background:linear-gradient(135deg,#fff,#f6f9ff);border:1px solid rgba(49,130,246,.16);border-radius:20px;padding:14px;margin-bottom:12px}.next-label{font-size:10px;font-weight:900;color:var(--blue);letter-spacing:.08em}.next-title{font-size:18px;font-weight:900;margin-top:5px}.next-time{font-size:12px;font-weight:900;color:#677183;margin-top:4px}

.report-title{font-size:17px;font-weight:900;margin-bottom:10px}.report-copy{font-size:13px;line-height:1.65;color:#4b5565}.bar-row{display:grid;grid-template-columns:64px 1fr 42px;gap:8px;align-items:center;margin:9px 0}.bar-lbl{font-size:12px;font-weight:800;color:#5d6675;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:8px;background:#edf1f7;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),#7c3aed);border-radius:999px}.bar-val{text-align:right;font-size:11px;font-weight:900;color:#4b5565}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f7}.list-row:last-child{border-bottom:none}.list-title{font-size:13px;font-weight:900}.list-sub{font-size:11px;color:var(--t3);margin-top:2px}.amount{font-size:13px;font-weight:900;color:var(--blue);white-space:nowrap}.tx-pending{color:#b97800}.tx-applied{color:#008c61}.tx-failed{color:#d92d3e}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:900;color:#485366;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #e2e8f0;background:#f7f9fc;border-radius:14px;padding:12px 13px;font-size:14px;font-weight:650;color:#111827;outline:none}.textarea{min-height:78px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(49,130,246,.1)}.help{font-size:11px;color:var(--t3);line-height:1.45;margin-top:5px}.checks{display:flex;gap:6px;flex-wrap:wrap}.check-chip{border:1px solid #e2e8f0;background:#f7f9fc;color:#617085;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.check-chip.on{background:rgba(49,130,246,.1);border-color:rgba(49,130,246,.26);color:var(--blue)}.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:218px;overflow-y:auto;padding:2px}.icon-pick{height:50px;border-radius:16px;border:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.icon-pick.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.12)}.icon-pick .ico-tile{width:36px;height:36px;border-radius:13px}.icon-pick .ico-tile svg{width:18px;height:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-option{border:1px solid #e2e8f0;background:#fff;border-radius:17px;padding:12px;text-align:left}.mode-option.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.1)}.mode-option-name{font-size:13px;font-weight:900;margin-top:7px}.mode-option-desc{font-size:10px;color:var(--t3);margin-top:2px}.mode-config-row{display:grid;grid-template-columns:72px 1fr 80px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f7}.mode-config-row:last-child{border-bottom:none}.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.46);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:flex-end;justify-content:center}.modal{width: /* v1.2.3 핵심 보너스 제거 + 보상 구조 단순화 */
.routine-card.ended{opacity:.82}
.routine-card.ended .routine-title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(75,85,101,.45);color:#7b8492}
.routine-card.ended .routine-time{color:#9aa4b5}
.routine-card.ended .ico-tile{filter:saturate(.72);opacity:.72}
.routine-card.done.ended{background:linear-gradient(135deg,#eefdf6,#fff);border-color:rgba(0,185,119,.26)}
.routine-card.failed.ended{background:linear-gradient(135deg,#fff7e8,#fff);border-color:rgba(246,166,9,.28)}
.routine-card.failed.ended .check{background:var(--yellow);border-color:var(--yellow);color:#fff;font-size:17px;font-weight:900}
.routine-card.failed.ended .check svg{display:none}
.routine-card.done.ended:after,.routine-card.failed.ended:after{content:attr(data-ended-label);position:absolute;right:14px;top:9px;font-size:10px;font-weight:900;color:#7b8492;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.8);border-radius:999px;padding:3px 7px}
.mode-row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mode-advanced{border:1px solid #e7edf5;background:#f8fafc;border-radius:16px;padding:10px 12px;margin-bottom:13px}
.mode-advanced summary{font-size:12px;font-weight:900;color:#4b5565;cursor:pointer;list-style:none}
.mode-advanced summary::-webkit-details-marker{display:none}
.mode-advanced summary:after{content:'펼치기';float:right;color:var(--blue);font-size:11px}
.mode-advanced[open] summary:after{content:'접기'}
.mode-advanced .mini-card{box-shadow:none;margin-top:10px;margin-bottom:0}
.mrm-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mrm-stat{background:#f7f9fc;border:1px solid #e5eaf2;border-radius:15px;padding:10px;text-align:center}
.mrm-stat b{display:block;font-size:16px;font-weight:900}.mrm-stat span{font-size:10px;font-weight:800;color:var(--t3)}
.mrm-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.mode-routine-row{border:1px solid #e4eaf2;background:#fff;border-radius:18px;padding:12px;margin-bottom:9px;transition:.15s}
.mode-routine-row.off{opacity:.55;background:#f8fafc}
.mrm-head{display:flex;align-items:center;gap:10px}
.mrm-title{font-size:13px;font-weight:900;line-height:1.35}.mrm-sub{font-size:11px;color:var(--t3);margin-top:2px}
.mrm-spacer{flex:1}
.mrm-controls{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;margin-top:10px}
.switch{position:relative;width:46px;height:27px;display:inline-flex;align-items:center}
.switch input{display:none}.switch span{position:absolute;inset:0;background:#dbe3ee;border-radius:999px;transition:.15s}.switch span:before{content:'';position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(18,24,38,.18);transition:.15s}.switch input:checked+span{background:var(--blue)}.switch input:checked+span:before{transform:translateX(19px)}
@media(max-width:360px){.mrm-controls{grid-template-columns:1fr 1fr}.mrm-controls .input{grid-column:1/3}.mrm-summary{grid-template-columns:1fr}}


/* v1.2.4 루틴 순서 관리 */
.order-actions{display:inline-flex;gap:4px;align-items:center;flex-shrink:0}
.order-btn{width:30px;height:30px;border-radius:10px;padding:0!important;font-size:12px!important;font-weight:900!important}
.quick-actions{align-items:center;flex-wrap:wrap}
.quick-actions .order-actions{margin-right:2px}
.order-guide{background:#f7f9fc;border:1px dashed #d9e2ee;border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#667085;line-height:1.45}
.order-guide b{color:#2f3747}
.settings-routine-actions{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mrm-head .order-actions{margin-left:auto;margin-right:8px}
.mode-routine-row.order-flash{box-shadow:0 0 0 3px rgba(49,130,246,.12);border-color:rgba(49,130,246,.35)}
@media(max-width:360px){.settings-routine-actions{justify-content:flex-start}.order-btn{width:28px;height:28px}.mrm-head{align-items:flex-start}}


/* v1.3.0 시간순 정렬 + 자동저장 + 완료 연출 + 주간회고 */
.order-mode-panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.order-mode-card{border:1px solid #e2e8f0;background:#f8fafc;border-radius:17px;padding:12px;text-align:left}
.order-mode-card.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.1);background:#fff}

function routineTimeSortValue(r,date=''){const t=date?routineTime(r,date):normalizeTime(r.targetTime);const n=timeToMin(t);return Number.isFinite(n)?n:9999}
function routineOrderComparator(date=''){const manual=state?.settings?.routineOrderMode==='manual';return (a,b)=>manual?(routineSortValue(a)-routineSortValue(b)||routineTimeSortValue(a,date)-routineTimeSortValue(b,date)||String(a.title||'').localeCompare(String(b.title||''),'ko')):(routineTimeSortValue(a,date)-routineTimeSortValue(b,date)||TIME_ORDER.indexOf(a.timeOfDay)-TIME_ORDER.indexOf(b.timeOfDay)||routineSortValue(a)-routineSortValue(b)||String(a.title||'').localeCompare(String(b.title||''),'ko'))}
function resetRoutineOrderByTime(){state.settings.routineOrderMode='time';const ids=[...state.routines].sort((a,b)=>routineTimeSortValue(a)-routineTimeSortValue(b)||TIME_ORDER.indexOf(a.timeOfDay)-TIME_ORDER.indexOf(b.timeOfDay)||String(a.title||'').localeCompare(String(b.title||''),'ko')).map(r=>r.id);applyRoutineOrder(ids)}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function fmt(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
function today(){return fmt(new Date())}
function addDays(date,n){const d=parseDate(date);d.setDate(d.getDate()+n);return fmt(d)}
function money(n){return Math.round(Number(n||0)).toLocaleString('ko-KR')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function svg(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${SVG[name]||SVG.spark}</svg>`}
function colorVars(key){const c=COLORS[key]||COLORS.blue;return `--c1:${c[0]};--c2:${c[1]};--m1:${c[0]};--m2:${c[1]}`}
function iconTile(iconKey,color='blue',cls='ico-tile'){return `<span class="${cls}" style="${colorVars(color)}">${svg(iconKey)}</span>`}
function guessIcon(r){const t=String(r?.title||'')+' '+String(r?.emoji||'')+' '+String(r?.glyph||'');if(/기상|일어나|아침/.test(t))return{iconKey:'sun',color:'blue'};if(/옷|복장|착장/.test(t))return{iconKey:'shirt',color:'purple'};if(/출발|출근|이동/.test(t))return{iconKey:'route',color:'teal'};if(/눈|시력|안구/.test(t))return{iconKey:'eye',color:'slate'};if(/식단|아침|단백질/.test(t))return{iconKey:'bowl',color:'gold'};if(/점심|샐러드/.test(t))return{iconKey:'leaf',color:'green'};if(/스픽|영어|말하기/.test(t))return{iconKey:'chat',color:'blue'};if(/도진|아기|가족|놀아/.test(t))return{iconKey:'child',color:'pink'};if(/헬스|운동|웨이트|스쿼트/.test(t))return{iconKey:'dumbbell',color:'red'};if(/공부|재무|자격|독서/.test(t))return{iconKey:'book',color:'purple'};if(/피아노|음악/.test(t))return{iconKey:'music',color:'purple'};if(/저녁|식사/.test(t))return{iconKey:'utensils',color:'orange'};if(/소비|지출|돈|가계/.test(t))return{iconKey:'card',color:'gold'};if(/취침|수면|잠/.test(t))return{iconKey:'moon',color:'slate'};if(/청소|정리|쓸기/.test(t))return{iconKey:'broom',color:'teal'};if(/빨래|세탁/.test(t))return{iconKey:'laundry',color:'blue'};if(/설거지|식기/.test(t))return{iconKey:'dishes',color:'teal'};if(/샤워|목욕/.test(t))return{iconKey:'shower',color:'blue'};if(/양치|치실|치아/.test(t))return{iconKey:'toothbrush',color:'teal'};if(/체중|몸무게|인바디/.test(t))return{iconKey:'scale',color:'slate'};if(/명상|호흡|회고|마음챙김/.test(t))return{iconKey:'meditation',color:'purple'};if(/일기|저널|기록/.test(t))return{iconKey:'journal',color:'slate'};if(/업무|출근|보고서|문서/.test(t))return{iconKey:'briefcase',color:'blue'};if(/코딩|개발|프로그래밍/.test(t))return{iconKey:'code',color:'purple'};if(/여행|출장/.test(t))return{iconKey:'suitcase',color:'orange'};if(/약|복용|영양제/.test(t))return{iconKey:'pill',color:'pink'};if(/커피|카페/.test(t))return{iconKey:'coffee',color:'orange'};if(/타이머|집중|시간/.test(t))return{iconKey:'timer',color:'orange'};return{iconKey:'spark',color:'purple'}}
function normalizeTime(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return'';const h=clamp(Number(m[1]),0,23),mi=clamp(Number(m[2]),0,59);return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function timeToMin(t){const n=normalizeTime(t);if(!n)return 9999;const [h,m]=n.split(':').map(Number);return h*60+m}
function formatTime(t){const n=normalizeTime(t);if(!n)return'시간 미설정';const [h,m]=n.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`}
function normalizePause(p){if(!p||!p.routineId||!p.startDate)return null;const start=String(p.startDate).slice(0,10);let end=String(p.endDate||start).slice(0,10);if(end<start)end=start;return Object.assign({id:uid('pause'),routineId:p.routineId,startDate:start,endDate:end,reason:'기타',memo:'',type:'planned_rest',createdAt:new Date().toISOString(),endedAt:null},p,{startDate:start,endDate:end})}
function isDateBetween(date,start,end){return String(date)>=String(start)&&String(date)<=String(end)}
function pauseForRoutine(id,date){return (state.routinePauses||[]).find(p=>!p.endedAt&&p.routineId===id&&isDateBetween(date,p.startDate,p.endDate))||null}
function isRoutinePaused(id,date){return !!pauseForRoutine(id,date)}
function pauseLabel(p){if(!p)return'';return p.startDate===p.endDate?`${p.startDate} 하루 휴식`:`${p.startDate} ~ ${p.endDate} 휴식`}
function scheduledRoutines(date){const modeId=modeForDate(date);const dow=parseDate(date).getDay();return state.routines.filter(r=>r.active!==false).filter(r=>{if(!(r.weekdays||[0,1,2,3,4,5,6]).includes(dow))return false;const cfg=(r.modeConfig||{})[modeId];if(cfg)return cfg.enabled!==false;return true}).sort(routineOrderComparator(date))}
function pausedRoutines(date){return scheduledRoutines(date).map(r=>({routine:r,pause:pauseForRoutine(r.id,date)})).filter(x=>x.pause)}
function pauseStats(dates){const rows=[];(state.routinePauses||[]).forEach(p=>{dates.forEach(d=>{if(isDateBetween(d,p.startDate,p.endDate)&&!p.endedAt)rows.push({date:d,pause:p,routine:state.routines.find(r=>r.id===p.routineId)})})});const byReason={};rows.forEach(x=>{byReason[x.pause.reason||'기타']=(byReason[x.pause.reason||'기타']||0)+1});return {count:rows.length,rows,byReason:Object.entries(byReason).sort((a,b)=>b[1]-a[1])}}
function modeById(id){return state.routineModes.find(m=>m.id===id)||state.routineModes.find(m=>m.isDefault)||state.routineModes[0]}
function defaultModeId(){return (state.routineModes.find(m=>m.isDefault)||state.routineModes[0]).id}
function modeForDate(date){const dow=parseDate(date).getDay();return state.modeDateOverrides[date]||state.weekdayModeDefaults[dow]||defaultModeId()}
function modeConfig(r,modeId){return Object.assign({enabled:r.active!==false,targetTime:r.targetTime||'',required:r.importance==='core',rewardEligible:r.rewardEligible!==false},(r.modeConfig||{})[modeId]||{})}
function routineTime(r,date){return normalizeTime(modeConfig(r,modeForDate(date)).targetTime||r.targetTime)}
function activeRoutines(date){return scheduledRoutines(date).filter(r=>!isRoutinePaused(r.id,date)).sort(routineOrderComparator(date))}
function dayObj(date){if(!state.completions[date])state.completions[date]={done:[],failed:{},notes:{},metrics:{}};const d=state.completions[date];d.done=Array.isArray(d.done)?d.done:[];d.failed=d.failed||{};d.notes=d.notes||{};d.metrics=d.metrics||{};return d}
function isDone(date,id){return (state.completions[date]?.done||[]).includes(id)}
function isFailed(date,id){return !!(state.completions[date]?.failed||{})[id]}
function numericConfig(r){const c=Object.assign({enabled:false,label:'',unit:'',target:''},r?.numberTrack||{});return {enabled:!!c.enabled,label:String(c.label||'숫자 기록'),unit:String(c.unit||''),target:String(c.target||'')}}
function hasNumberTrack(r){return !!numericConfig(r).enabled}
function getNumberRecord(date,id){return state.completions[date]?.metrics?.[id]||null}
function formatMetricValue(rec,cfg){if(!rec||rec.value===''||rec.value===undefined||rec.value===null)return'';const n=Number(rec.value);const v=Number.isFinite(n)?(Number.isInteger(n)?String(n):String(Math.round(n*100)/100)):String(rec.value);return v+(cfg?.unit?' '+cfg.unit:'')}
function metricSummary(r,date){if(!hasNumberTrack(r))return'';const cfg=numericConfig(r),rec=getNumberRecord(date,r.id);if(rec)return `<div class="metric-inline">${esc(cfg.label)}: ${esc(formatMetricValue(rec,cfg))}</div>`;return `<div class="metric-inline" style="color:#667085;background:#f8fafc;border-color:#e6edf7">${esc(cfg.label)} 기록 대기${cfg.unit?' · '+esc(cfg.unit):''}</div>`}

function metricRoutines(){return orderedRoutines().filter(r=>hasNumberTrack(r))}
function metricSeriesAll(id){return Object.keys(state.completions||{}).sort().map(d=>{const rec=getNumberRecord(d,id);const v=Number(rec?.value);return Number.isFinite(v)?{date:d,value:v,note:rec?.note||''}:null}).filter(Boolean)}
function metricSeries(id,endDate=today(),days=30){if(days==='all'||days===0||days===Infinity)return metricSeriesAll(id);const start=addDays(endDate,-days+1);return getDateRange(start,endDate).map(d=>{const rec=getNumberRecord(d,id);const v=Number(rec?.value);return Number.isFinite(v)?{date:d,value:v,note:rec?.note||''}:null}).filter(Boolean)}
function metricPeriodLabel(days){return days==='all'||days===0||days===Infinity?'전체 기간':`최근 ${days}일`}
function metricNumber(v){if(!Number.isFinite(Number(v)))return '-';const n=Number(v);return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)}
function metricTrendText(points,cfg){if(points.length<2)return {text:'기록 대기',cls:'flat'};const first=points[0].value,last=points[points.length-1].value,diff=last-first;const unit=cfg?.unit?' '+cfg.unit:'';if(Math.abs(diff)<0.000001)return {text:'변화 없음',cls:'flat'};return {text:(diff>0?'+':'')+metricNumber(diff)+unit,cls:diff>0?'up':'down'}}
function metricStats(points,cfg){if(!points.length)return {avg:'-',min:'-',max:'-'};const vals=points.map(p=>p.value);const avg=vals.reduce((a,b)=>a+b,0)/vals.length;const unit=cfg?.unit?' '+cfg.unit:'';return {avg:metricNumber(avg)+unit,min:metricNumber(Math.min(...vals))+unit,max:metricNumber(Math.max(...vals))+unit}}
function renderMetricSvg(points,cfg){const w=320,h=136,padL=24,padR=14,padT=18,padB=24;if(!points.length)return `<div class="metric-chart-empty">아직 그래프로 표시할 숫자 기록이 없습니다.<br>루틴 완료 시 숫자를 2회 이상 입력하면 추세가 선명해집니다.</div>`;const vals=points.map(p=>p.value);let min=Math.min(...vals),max=Math.max(...vals);const target=Number(cfg?.target);if(Number.isFinite(target)){min=Math.min(min,target);max=Math.max(max,target)}if(min===max){min-=1;max+=1}const span=max-min;const x=(i)=>points.length===1?(w-padL-padR)/2+padL:padL+(i/(points.length-1))*(w-padL-padR);const y=(v)=>padT+(max-v)/span*(h-padT-padB);const line=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.value).toFixed(1)).join(' ');const area=`M${x(0).toFixed(1)} ${h-padB} `+points.map((p,i)=>`L${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ')+` L${x(points.length-1).toFixed(1)} ${h-padB} Z`;const dots=points.map((p,i)=>`<circle class="metric-chart-dot" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3"><title>${esc(p.date)} · ${esc(metricNumber(p.value)+(cfg?.unit?' '+cfg.unit:''))}</title></circle>`).join('');const grid=[0,.25,.5,.75,1].map(t=>{const gy=padT+t*(h-padT-padB);return `<line class="metric-chart-grid" x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}"/>`}).join('');const targetLine=Number.isFinite(target)?`<line class="metric-chart-target" x1="${padL}" y1="${y(target).toFixed(1)}" x2="${w-padR}" y2="${y(target).toFixed(1)}"><title>목표 ${esc(metricNumber(target)+(cfg?.unit?' '+cfg.unit:''))}</title></line>`:'';const firstLabel=points[0]?.date.slice(5).replace('-','/'),lastLabel=points[points.length-1]?.date.slice(5).replace('-','/');return `<svg class="metric-chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="숫자 기록 추이"><path class="metric-chart-area" d="${area}"></path>${grid}${targetLine}<path class="metric-chart-line" d="${line}"></path>${dots}<text x="${padL}" y="${h-7}" font-size="10" fill="#8b95a5" font-weight="800">${esc(firstLabel||'')}</text><text x="${w-padR}" y="${h-7}" font-size="10" fill="#8b95a5" font-weight="800" text-anchor="end">${esc(lastLabel||'')}</text></svg>`}
function renderMetricChartCard(r,endDate=today(),days=30){const cfg=numericConfig(r),points=metricSeries(r.id,endDate,days);const latest=points[points.length-1];const trend=metricTrendText(points,cfg);const st=metricStats(points,cfg);const unit=cfg.unit?' '+cfg.unit:'';const period=metricPeriodLabel(days);return `<div class="metric-chart-card"><div class="metric-chart-head"><div><div class="metric-chart-name">${iconTile(r.iconKey,r.color,'ico-mini')}${esc(r.title)}</div><div class="metric-chart-sub">${esc(cfg.label)} · ${period} ${points.length}회 기록${cfg.target?' · 목표 '+esc(cfg.target)+unit:''}</div></div><div><div class="metric-chart-latest">${latest?esc(metricNumber(latest.value)+unit):'-'}</div><div class="metric-chart-delta ${trend.cls}">${esc(trend.text)}</div></div></div>${renderMetricSvg(points,cfg)}<div class="metric-chart-stats"><div class="metric-chart-stat"><b>${esc(st.avg)}</b><span>평균</span></div><div class="metric-chart-stat"><b>${esc(st.min)}</b><span>최저</span></div><div class="metric-chart-stat"><b>${esc(st.max)}</b><span>최고</span></div></div></div>`}
function renderMetricCharts(endDate=today(),days=30,limit=6){const period=metricPeriodLabel(days);const rows=metricRoutines().map(r=>({routine:r,points:metricSeries(r.id,endDate,days)})).filter(x=>x.points.length).sort((a,b)=>b.points[b.points.length-1].date.localeCompare(a.points[a.points.length-1].date)||b.points.length-a.points.length);if(!rows.length)return `<section class="card"><div class="metric-chart-toolbar"><div><div class="report-title" style="margin-bottom:2px">숫자 기록 그래프</div><div class="sub">숫자 기록을 1회 이상 남기면 이곳에 추이가 표시됩니다.</div></div></div><div class="metric-chart-empty">아직 그래프로 볼 숫자 기록이 없습니다.<br>몸무게, 공부시간, 운동세트 같은 루틴에서 숫자 기록을 남겨보세요.</div></section>`;return `<section class="card"><div class="metric-chart-toolbar"><div><div class="report-title" style="margin-bottom:2px">숫자 기록 그래프</div><div class="sub">${period} 기준입니다. 목표값이 있으면 초록 점선으로 함께 표시됩니다.</div></div><span class="deck-hidden-note">${rows.length}개 지표</span></div>${rows.slice(0,limit).map(x=>renderMetricChartCard(x.routine,endDate,days)).join('')}${rows.length>limit?`<div class="help">${period} 기록이 있는 지표 ${rows.length}개 중 ${limit}개만 먼저 표시합니다.</div>`:''}</section>`}

function markRoutineDone(date,id){const d=dayObj(date);if(!d.done.includes(id))d.done.push(id);delete d.failed[id]}
function deckPendingRoutines(date){return activeRoutines(date).filter(r=>!isDone(date,r.id))}
function renderNumberRecords(date){const rows=activeRoutines(date).filter(r=>hasNumberTrack(r));if(!rows.length)return'';const doneRows=rows.filter(r=>getNumberRecord(date,r.id));const body=rows.map(r=>{const cfg=numericConfig(r),rec=getNumberRecord(date,r.id),done=isDone(date,r.id);return `<div class="metric-row"><div><div class="metric-title">${esc(r.title)}</div><div class="metric-note">${esc(cfg.label)}${cfg.target?' · 목표 '+esc(cfg.target)+(cfg.unit?' '+esc(cfg.unit):''):''}${rec?.note?' · '+esc(rec.note):''}</div></div><div style="text-align:right"><div class="metric-value">${rec?esc(formatMetricValue(rec,cfg)):(done?'기록 없음':'대기')}</div><button class="btn btn-soft btn-sm" data-edit-number="${r.id}" data-date="${date}">${rec?'수정':'기록'}</button></div></div>`}).join('');return `<section class="card"><div class="metric-panel-title"><span>숫자 기록</span><span class="deck-hidden-note">${doneRows.length}/${rows.length}개 기록</span></div><div class="metric-panel">${body}</div></section>`}
function renderPauseRecords(date){const rows=pausedRoutines(date);if(!rows.length)return'';return `<section class="card"><div class="metric-panel-title"><span>루틴 휴식</span><span class="pause-chip">${rows.length}개 제외</span></div><div class="pause-panel">${rows.map(({routine:r,pause:p})=>`<div class="pause-row"><div><div class="pause-title">${iconTile(r.iconKey,r.color,'ico-mini')}${esc(r.title)}</div><div class="pause-sub">${esc(p.reason||'기타')} · ${esc(pauseLabel(p))}${p.memo?' · '+esc(p.memo):''}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end"><button class="btn btn-soft btn-sm" data-edit-pause="${p.id}">수정</button><button class="btn btn-yellow btn-sm" data-end-pause="${p.id}">복귀</button></div></div>`).join('')}</div></section>`}
function openNumberRecord(date,id,markDoneAfter=true,playAfter=true){const r=state.routines.find(x=>x.id===id);if(!r)return;const cfg=numericConfig(r),old=getNumberRecord(date,id)||{};showModal(`<div class="modal-drag"></div><h2 class="modal-title">숫자 기록</h2><p class="modal-sub">${esc(r.title)} 완료 값도 함께 남깁니다.</p><div class="field"><label>${esc(cfg.label)}${cfg.unit?' ('+esc(cfg.unit)+')':''}</label><input class="input" id="metric-value" type="number" step="any" inputmode="decimal" value="${esc(old.value??'')}" placeholder="예: 72.4"></div><div class="field"><label>메모</label><input class="input" id="metric-note" value="${esc(old.note||'')}" placeholder="예: 공복, 운동 후, 저녁 전"></div>${cfg.target?`<div class="help">목표값: ${esc(cfg.target)}${cfg.unit?' '+esc(cfg.unit):''}</div>`:''}<div style="height:12px"></div><div class="grid2"><button class="btn btn-soft" id="complete-without-metric">기록 없이 완료</button><button class="btn btn-blue" id="save-metric">기록하고 완료</button></div>`);document.getElementById('save-metric').onclick=()=>{const raw=document.getElementById('metric-value').value;const val=Number(raw);if(raw===''||!Number.isFinite(val)){toast('숫자를 입력해주세요.');return}const d=dayObj(date);d.metrics[id]={value:val,label:cfg.label,unit:cfg.unit,note:document.getElementById('metric-note').value.trim(),at:new Date().toISOString()};if(markDoneAfter)markRoutineDone(date,id);save();closeModal();render();if(markDoneAfter&&playAfter)playCompletionEffect(r,date)};document.getElementById('complete-without-metric').onclick=()=>{const d=dayObj(date);if(markDoneAfter)markRoutineDone(date,id);save();closeModal();render();if(markDoneAfter&&playAfter)playCompletionEffect(r,date)}}
function getRate(date){const list=activeRoutines(date);const done=list.filter(r=>isDone(date,r.id)).length;const paused=pausedRoutines(date).length;return {done,total:list.length,pct:list.length?Math.round(done/list.length*100):0,paused}}
function calcDayReward(date){const base=scheduledRoutines(date).filter(r=>modeConfig(r,modeForDate(date)).rewardEligible!==false);const list=activeRoutines(date).filter(r=>modeConfig(r,modeForDate(date)).rewardEligible!==false);const done=list.filter(r=>isDone(date,r.id));const mode=modeById(modeForDate(date));const rate=list.length?done.length/list.length:0;const minRatio=Number(state.settings.pauseMinActiveRatio||50)/100;const pausedCount=Math.max(0,base.length-list.length);const recoveryDay=pausedCount>0&&base.length&&list.length/base.length<minRatio;let amount=0,parts=[];if(recoveryDay&&done.length===list.length&&list.length){amount+=Number(state.settings.pauseRecoveryReward||1500);parts.push('회복일 완료')}else if(list.length&&rate>=1){amount+=Number(mode.fullReward||10000);parts.push('100% 완료')}else if(list.length&&rate>=.8){amount+=Number(mode.partialReward||5000);parts.push('80% 이상 완료')}return {date,amount,parts,rate:Math.round(rate*100),modeId:mode.id,pausedCount,recoveryDay}}
function getDateRange(start,end){const out=[];let d=parseDate(start),e=parseDate(end);while(d<=e){out.push(fmt(d));d.setDate(d.getDate()+1)}return out}
function weekStart(date){const d=parseDate(date);const day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return fmt(d)}
function monthStart(date){const d=parseDate(date);return fmt(new Date(d.getFullYear(),d.getMonth(),1))}
function monthEnd(date){const d=parseDate(date);return fmt(new Date(d.getFullYear(),d.getMonth()+1,0))}
function deriveRewards(days=180){const dates=getDateRange(addDays(today(),-days),today());const daily=dates.map(calcDayReward).filter(r=>r.amount>0);const weekly={};daily.forEach(r=>{weekly[weekStart(r.date)]=(weekly[weekStart(r.date)]||new Set()).add(r.date)});Object.entries(weekly).forEach(([w,set])=>{if([...set].length>=5){const ds=[...set].sort();daily.push({id:'weekly_'+w,date:ds[ds.length-1],amount:Number(state.settings.weeklyBonus||0),parts:['주간 5일 이상 성공'],rate:100,modeId:'weekly'})}});return daily.map(r=>Object.assign({id:'reward_'+r.date+'_'+r.parts.join('_')},r))}
function totalEarned(){return deriveRewards().reduce((a,r)=>a+Number(r.amount||0),0)}
function transferredTotal(filter=()=>true){return (state.transfers||[]).filter(filter).reduce((a,t)=>a+Number(t.amount||0),0)}
function walletBalance(){return Math.max(0,totalEarned()-transferredTotal(t=>t.status!=='failed'))}
function streakTo(date=today()){let s=0,d=date;while(true){const r=getRate(d);if(!r.total||r.pct<100)break;s++;d=addDays(d,-1)}return s}
function longestStreak(dates){let max=0,cur=0;dates.forEach(d=>{const r=getRate(d);if(r.total&&r.pct===100){cur++;max=Math.max(max,cur)}else cur=0});return max}
function routineStats(dates){return state.routines.map(r=>{let active=0,done=0,miss=0;dates.forEach(d=>{if(activeRoutines(d).some(x=>x.id===r.id)){active++;if(isDone(d,r.id))done++;else miss++}});return {routine:r,active,done,miss,pct:active?Math.round(done/active*100):0}}).filter(x=>x.active>0)}
function failReasonStats(dates){const map={};dates.forEach(d=>{const f=state.completions[d]?.failed||{};Object.values(f).forEach(x=>{map[x.reason||'기타']=(map[x.reason||'기타']||0)+1})});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function rangeStats(dates){const activeDays=dates.filter(d=>getRate(d).total>0);const avg=activeDays.length?Math.round(activeDays.reduce((a,d)=>a+getRate(d).pct,0)/activeDays.length):0;const rewards=deriveRewards(220).filter(r=>dates.includes(r.date));const totalEarned=rewards.reduce((a,r)=>a+Number(r.amount||0),0);const transfers=(state.transfers||[]).filter(t=>t.status!=='failed'&&dates.includes(String(t.createdAt||'').slice(0,10))).reduce((a,t)=>a+Number(t.amount||0),0);return {avg,totalEarned,transfers,full:activeDays.filter(d=>getRate(d).pct===100).length,activeDays:activeDays.length}}
function weekdayStats(dates){return DOW.map((name,i)=>{const ds=dates.filter(d=>parseDate(d).getDay()===i&&getRate(d).total);const avg=ds.length?Math.round(ds.reduce((a,d)=>a+getRate(d).pct,0)/ds.length):0;return {name,avg,count:ds.length}})}
function timeStats(dates){return TIME_ORDER.map(t=>{let active=0,done=0;dates.forEach(d=>activeRoutines(d).filter(r=>r.timeOfDay===t).forEach(r=>{active++;if(isDone(d,r.id))done++}));return {name:t,pct:active?Math.round(done/active*100):0,count:active}})}
function nextRoutine(date=today()){const list=activeRoutines(date).filter(r=>!isDone(date,r.id));if(!list.length)return null;const cur=date===today()?new Date().getHours()*60+new Date().getMinutes():0;return list.sort((a,b)=>Math.abs(timeToMin(routineTime(a,date))-cur)-Math.abs(timeToMin(routineTime(b,date))-cur))[0]}
function routineTimeState(date,r){const t=routineTime(r,date);if(!t||date!==today()||isDone(date,r.id))return'';const cur=new Date().getHours()*60+new Date().getMinutes();const diff=timeToMin(t)-cur;if(diff<0)return'late';if(diff<=60)return'due';return''}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));document.querySelectorAll('[data-nav-icon]').forEach(el=>el.innerHTML=svg(el.dataset.navIcon));document.getElementById('page-title').textContent=ui.tab==='home'?'DQ Loop':ui.tab==='records'?'기록':ui.tab==='reports'?'리포트':ui.tab==='wallet'?'지갑':'설정';document.getElementById('page-date').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});if(ui.tab==='home')renderHome();if(ui.tab==='records')renderRecords();if(ui.tab==='reports')renderReports();if(ui.tab==='wallet')renderWallet();if(ui.tab==='settings')renderSettings()}
function renderHero(title,sub){return `<section class="card hero"><div class="hero-k">DQ LOOP</div><div class="hero-title">${title}</div><div class="hero-sub">${sub}</div></section>`}
function renderWeekbar(date){const s=weekStart(date);return `<div class="weekbar">${getDateRange(s,addDays(s,6)).map(d=>{const r=getRate(d);return `<button class="daybtn ${d===date?'on':''}" data-home-date="${d}"><div class="dw">${DOW[parseDate(d).getDay()]}</div><div class="dd">${parseDate(d).getDate()}</div><div class="dot ${r.pct===100?'green':r.pct>0?'blue':''}"></div></button>`}).join('')}</div>`}
function renderHome(){const date=ui.homeDate;const rate=getRate(date);const mode=modeById(modeForDate(date));const list=activeRoutines(date);const reward=calcDayReward(date);const next=nextRoutine(date);document.getElementById('main').innerHTML=renderHero('DQ Loop','하루 루틴을 DQ 성장 자금으로 바꾸는 루틴 운영 앱입니다.')+renderWeekbar(date)+
`<section class="card mode-card"><div class="mode-icon" style="${colorVars(mode.color)}">${svg(mode.iconKey)}</div><div class="mode-body"><div class="mode-name">${esc(mode.name)} 적용 중</div><div class="mode-desc">${esc(mode.description||'오늘의 상황에 맞는 루틴 세트')}</div><div class="chip-row"><span class="chip blue">루틴 ${list.length}개</span><span class="chip green">완료 ${rate.done}개</span>${rate.paused?`<span class="pause-chip">휴식 ${rate.paused}개</span>`:''}<span class="chip yellow">예상 보상 ${money(reward.amount)}원</span></div></div><button class="btn btn-soft btn-sm" data-mode-date="${date}">모드 변경</button></section>`+
`<section class="card"><div class="progress-wrap"><div class="ring" style="--pct:${rate.pct}%"><div class="ring-in"><b>${rate.pct}%</b><span>${rate.done}/${rate.total}</span></div></div><div style="flex:1"><div class="section" style="margin:0 0 8px"><h3>오늘 진행률</h3></div><div class="sub">현재 스트릭 <b>${streakTo(date)}일</b><br>지갑 잔고 <b>${money(walletBalance())}원</b><br>${rate.paused?`휴식 루틴 <b>${rate.paused}개</b><br>`:''}${reward.recoveryDay?'휴식이 많아 회복일 보상만 적용됩니다.':(reward.parts.length?`오늘 보상: ${reward.parts.join(' + ')}`:'80% 이상 달성하면 보상이 시작됩니다.')}</div></div></div></section>`+
renderRoutineDeck(date)+
(next?`<section class="next-box"><div class="next-label">NEXT LOOP</div><div class="next-title">${esc(next.title)}</div><div class="next-time">${formatTime(routineTime(next,date))} · ${esc(mode.name)} · ${next.importance==='core'?'핵심 루틴':'일반 루틴'}</div></section>`:`<section class="next-box"><div class="next-label">ROUTE CLEAR</div><div class="next-title">오늘 루틴을 모두 완료했습니다</div><div class="next-time">완료 보상은 지갑에 자동 반영됩니다.</div></section>`)+
renderPauseRecords(date)+`<div class="section"><h3>오늘의 루틴</h3><button class="link" data-open-routine="new">+ 루틴 추가</button></div>`+renderRoutineList(date,true)}
function renderRoutineDeck(date){const all=activeRoutines(date);const list=deckPendingRoutines(date);const rate=getRate(date);if(!all.length)return `<section class="card deck-card"><div class="deck-empty"><b>오늘의 루틴 덱이 비었습니다</b>반복 요일 또는 적용 모드를 조정하면 이곳에 카드가 생성됩니다.</div></section>`;if(!list.length)return `<section class="card deck-card"><div class="deck-head"><div><div class="deck-label">TODAY ROUTINE DECK</div><div class="report-title" style="margin:2px 0 0">오늘의 루틴 덱</div></div><span class="deck-count">${rate.done}/${rate.total} 완료${rate.paused?' · 휴식 '+rate.paused:''}</span></div><div class="deck-clear-card"><div class="deck-clear-icon">${svg('trophy')}</div><div><div class="deck-clear-title">오늘 덱 올클리어</div><div class="deck-clear-sub">완료된 카드는 덱에서 자동으로 사라졌습니다. 오늘 남은 루틴이 없습니다.</div></div></div></section>`;let idx=Number(ui.deckIndex||0);if(idx<0||idx>=list.length){idx=0;ui.deckIndex=0}const r=list[idx];const done=isDone(date,r.id),failed=isFailed(date,r.id);const mode=modeById(modeForDate(date));const cfg=modeConfig(r,modeForDate(date));const pct=all.length?Math.round(((all.length-list.length+1)/all.length)*100):0;const dots=list.map((x,i)=>`<span class="deck-dot ${i===idx?'on':''} ${isFailed(date,x.id)?'failed':''}"></span>`).join('');return `<section class="card deck-card"><div class="deck-head"><div><div class="deck-label">TODAY ROUTINE DECK</div><div class="report-title" style="margin:2px 0 0">오늘의 루틴 덱</div></div><span class="deck-count">남은 카드 ${list.length}장${rate.paused?' · 휴식 '+rate.paused:''}</span></div><div class="deck-stage ${failed?'failed':''}"><div class="deck-topline">${iconTile(r.iconKey,r.color)}<div class="deck-main"><div class="deck-time">${formatTime(routineTime(r,date))} · ${esc(mode.name)}</div><div class="deck-title two-line">${esc(r.title)}</div><div class="deck-meta"><span class="chip ${r.importance==='core'?'purple':''}">${r.importance==='core'?'핵심 카드':'일반 카드'}</span><span class="chip blue">${r.timeOfDay}</span>${cfg.rewardEligible!==false?'<span class="chip green">보상 반영</span>':'<span class="chip">보상 제외</span>'}${hasNumberTrack(r)?'<span class="chip purple metric-badge">숫자 기록</span>':''}${failed?'<span class="chip yellow">실패 기록됨</span>':'<span class="chip blue">진행 대기</span>'}</div>${metricSummary(r,date)}</div></div><div class="deck-status">완료·휴식 처리 시 덱에서 자동 제거됩니다.</div><div class="deck-progress"><div class="deck-progress-fill" style="width:${pct}%"></div></div><div class="deck-dots">${dots}</div></div><div class="deck-actions"><button class="btn btn-soft deck-nav-btn" data-deck-prev="1">‹</button><button class="btn btn-blue" data-deck-complete="${r.id}" data-date="${date}">완료</button><button class="btn btn-yellow" data-pause-routine="${r.id}" data-date="${date}">휴식</button><button class="btn btn-soft" data-deck-fail="${r.id}" data-date="${date}">${failed?'실패 수정':'실패'}</button><button class="btn btn-soft deck-nav-btn" data-deck-next="1">›</button></div></section>`}
function completeRoutineFromDeck(date,id){const d=dayObj(date);const r=state.routines.find(x=>x.id===id);if(!r)return;if(d.done.includes(id))return toast('이미 완료된 루틴입니다.');if(hasNumberTrack(r)){openNumberRecord(date,id,true,true);return}markRoutineDone(date,id);save();const list=deckPendingRoutines(date);ui.deckIndex=Math.min(Number(ui.deckIndex||0),Math.max(0,list.length-1));render();playCompletionEffect(r,date)}
function moveDeck(dir){const list=deckPendingRoutines(ui.homeDate);if(!list.length)return;ui.deckIndex=(Number(ui.deckIndex||0)+Number(dir)+list.length)%list.length;render()}
function renderRoutineList(date,actions=false){const list=activeRoutines(date);const pauses=pausedRoutines(date);if(!list.length&&!pauses.length)return `<div class="empty"><b>이 날짜와 모드에 표시할 루틴이 없습니다.</b><br>반복 요일 또는 모드별 루틴 구성을 확인해주세요.</div>`;const modeTxt=state.settings.routineOrderMode==='manual'?'수동 순서':'시간순 자동정렬';const activeHtml=list.length?list.map(r=>renderRoutineCard(r,date,actions)).join(''):`<div class="empty"><b>평가 대상 루틴이 없습니다.</b><br>휴식 중인 루틴만 있습니다.</div>`;const pauseHtml=(state.settings.pauseDisplay==='hidden'||!pauses.length)?'':`<div class="time-group-label"><span>휴식 중</span><span>${pauses.length}개</span></div>`+pauses.map(x=>renderPausedRoutineCard(x.routine,x.pause,date,actions)).join('');return `<div class="time-group-label"><span>${modeTxt}</span><span>${list.filter(r=>isDone(date,r.id)).length}/${list.length}${pauses.length?' · 휴식 '+pauses.length:''}</span></div><div class="order-guide"><b>순서 변경:</b> ↑↓ 버튼을 누르면 수동 순서 모드로 전환되고, 홈·기록·리포트·루틴 구성 화면에 동일하게 반영됩니다.</div>`+activeHtml+pauseHtml}
function orderButtons(id,date){return `<span class="order-actions"><button class="btn btn-soft btn-sm order-btn" data-move-routine="${id}" data-move-dir="-1" ${date?`data-move-date="${date}"`:''} title="위로 이동">↑</button><button class="btn btn-soft btn-sm order-btn" data-move-routine="${id}" data-move-dir="1" ${date?`data-move-date="${date}"`:''} title="아래로 이동">↓</button></span>`}
function renderRoutineCard(r,date,actions=false){const done=isDone(date,r.id),failed=isFailed(date,r.id),ended=done||failed,st=routineTimeState(date,r),cfg=modeConfig(r,modeForDate(date));const endedLabel=done?'완료됨':failed?'실패 종료':'';const statusChip=done?'<span class="chip green">완료 종료</span>':failed?'<span class="chip yellow">실패 종료</span>':'';const metricChip=hasNumberTrack(r)?'<span class="chip purple">숫자 기록</span>':'';const metricLine=metricSummary(r,date);return `<article class="routine-card ${done?'done':''} ${failed?'failed':''} ${ended?'ended':''} ${st}" data-card-routine="${r.id}" data-ended-label="${endedLabel}">${iconTile(r.iconKey,r.color)}<div class="routine-main"><div class="routine-time">${formatTime(routineTime(r,date))}</div><div class="routine-title two-line">${esc(r.title)}</div><div class="routine-meta"><span class="chip ${r.importance==='core'?'purple':''}">${r.importance==='core'?'핵심':'일반'}</span><span class="chip blue">${DOW.filter((_,i)=>(r.weekdays||[]).includes(i)).join('')}</span>${cfg.rewardEligible!==false?'<span class="chip green">보상</span>':'<span class="chip">보상 제외</span>'}${metricChip}${statusChip}${!ended&&st==='late'?'<span class="chip red">시간 지남</span>':!ended&&st==='due'?'<span class="chip blue">곧 실행</span>':''}</div>${metricLine}${actions?`<div class="quick-actions">${orderButtons(r.id,date)}<button class="btn btn-soft btn-sm" data-fail="${r.id}" data-date="${date}">${failed?'실패 수정':'실패'}</button><button class="btn btn-yellow btn-sm" data-pause-routine="${r.id}" data-date="${date}">휴식</button>${hasNumberTrack(r)?`<button class="btn btn-soft btn-sm" data-edit-number="${r.id}" data-date="${date}">숫자 기록</button>`:''}<button class="btn btn-soft btn-sm" data-edit-routine="${r.id}">수정</button></div>`:''}</div><button class="check" data-toggle="${r.id}" data-date="${date}">${failed?'×':svg('check')}</button></article>`}

function renderRecords(){const m=ui.calendarMonth,y=m.getFullYear(),mo=m.getMonth();const first=new Date(y,mo,1).getDay();const days=new Date(y,mo+1,0).getDate();let cells='';DOW.forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);for(let i=0;i<first;i++)cells+=`<div></div>`;for(let day=1;day<=days;day++){const d=fmt(new Date(y,mo,day));const r=getRate(d);const mode=modeById(modeForDate(d));cells+=`<button class="cal-cell ${d===ui.recordDate?'on':''} ${r.pct===100?'cal-100':r.pct>=70?'cal-70':r.pct>0?'cal-some':''}" data-rec-date="${d}"><div class="cal-day">${day}</div><div class="cal-rate">${r.total?r.pct+'%':'-'}</div><div class="cal-mode" style="${colorVars(mode.color)}"></div></button>`}const date=ui.recordDate;const mode=modeById(modeForDate(date));const rate=getRate(date);document.getElementById('main').innerHTML=renderHero('기록','날짜별 루틴 달성률과 적용 모드를 확인하고 미리 예약합니다.')+`<section class="card"><div class="cal-head"><button class="btn btn-soft btn-sm" id="prev-month">‹</button><div class="cal-title">${y}년 ${mo+1}월</div><button class="btn btn-soft btn-sm" id="next-month">›</button></div><div class="cal-grid">${cells}</div></section><section class="card mode-card"><div class="mode-icon" style="${colorVars(mode.color)}">${svg(mode.iconKey)}</div><div class="mode-body"><div class="mode-name">${date} · ${esc(mode.name)}</div><div class="mode-desc">달성률 ${rate.pct}% · ${rate.done}/${rate.total}개 완료${rate.paused?' · 휴식 '+rate.paused+'개':''}</div></div><button class="btn btn-blue btn-sm" data-mode-date="${date}">모드 예약</button></section>${renderNumberRecords(date)}${renderPauseRecords(date)}${renderMetricCharts(date,'all',6)}<div class="section"><h3>선택 날짜 루틴</h3></div>${renderRoutineList(date,true)}`}

function buildWeeklyReview(wDates,w,mo,stats,fails,wd,ts){const best=[...stats].sort((a,b)=>b.pct-a.pct||b.done-a.done)[0];const worst=[...stats].sort((a,b)=>a.pct-b.pct||b.miss-a.miss)[0];const weakDay=[...wd].filter(x=>x.count).sort((a,b)=>a.avg-b.avg)[0];const weakTime=[...ts].filter(x=>x.count).sort((a,b)=>a.pct-b.pct)[0];const fullDays=wDates.filter(d=>getRate(d).pct===100).length;const failsText=fails.length?fails.map(x=>`${x[0]} ${x[1]}회`).join(', '):'실패 사유 기록 없음';const ps=pauseStats(wDates);const topPause=ps.byReason[0];const allowance=Number(state.settings.pauseWeeklyAllowance||3);const pauseText=ps.count?`이번 주 루틴 휴식은 ${ps.count}회였고, 가장 많은 사유는 ${topPause?topPause[0]+' '+topPause[1]+'회':'기타'}입니다.${ps.count>allowance?' 주간 휴식권 기준을 넘었으므로 다음 주에는 루틴 수나 난이도 조정이 필요합니다.':' 계획된 회복으로 기록되었습니다.'}`:'이번 주 계획 휴식은 없었습니다.';const good=w.avg>=80?`이번 주 평균 성공률이 ${w.avg}%로 루틴 흐름이 유지되었습니다. 특히 ${best?.routine?.title||'핵심 루틴'} 루틴이 가장 안정적이었습니다.`:`이번 주 평균 성공률은 ${w.avg}%입니다. 아직 흐름을 만드는 구간이며, 완료일 ${fullDays}일을 기준점으로 잡으면 됩니다.`;const issue=worst?`${worst.routine.title} 루틴이 ${worst.miss}회 흔들렸습니다. 실패 사유는 ${failsText} 순서로 기록되었습니다. ${pauseText}`:`아직 뚜렷하게 흔들린 루틴은 없습니다. ${pauseText}`;const action=ps.count>allowance?`휴식이 잦은 루틴은 삭제가 아니라 난이도 조정이 먼저입니다. 다음 주에는 가장 많이 쉰 루틴을 5분 대체 루틴으로 낮춰 복귀 성공률을 확인하세요.`:weakTime&&weakTime.pct<70?`${weakTime.name} 시간대 루틴을 1개 줄이거나 실행 시간을 30분 앞당기는 것이 다음 주 1순위 전략입니다.`:weakDay&&weakDay.avg<70?`${weakDay.name}요일 성공률이 낮습니다. 해당 요일은 가벼운모드 또는 비상모드로 미리 예약해 실패 비용을 낮추는 것이 좋습니다.`:worst?`${worst.routine.title} 루틴은 난이도를 낮추거나 보상 제외 루틴으로 전환해 루틴 저항감을 줄이는 것이 좋습니다.`:`다음 주에는 현재 모드를 유지하면서 100% 완료일을 1일만 더 늘리는 것을 목표로 잡으면 됩니다.`;const text=`[DQ Loop 주간 회고]
- 성공률: ${w.avg}% / 완료일: ${fullDays}일 / 주간 적립액: ${money(w.totalEarned)}원 / 루틴 휴식: ${ps.count}회
- 잘한 점: ${good}
- 흔들린 점: ${issue}
- 다음 주 전략: ${action}`;const html=`<div class="weekly-review"><h4>잘한 점</h4><p>${esc(good)}</p><h4>흔들린 점</h4><p>${esc(issue)}</p><h4>휴식 분석</h4><p>${esc(pauseText)}</p><h4>다음 주 전략</h4><p>${esc(action)}</p></div>`;return {text,html}}
function renderReports(){const w0=weekStart(today()),wDates=getDateRange(w0,addDays(w0,6));const mDates=getDateRange(monthStart(today()),monthEnd(today()));const w=rangeStats(wDates),mo=rangeStats(mDates);const stats=routineStats(wDates);const best=[...stats].sort((a,b)=>b.pct-a.pct||b.done-a.done)[0];const worst=[...stats].sort((a,b)=>a.pct-b.pct||b.miss-a.miss)[0];const fails=failReasonStats(wDates);const wd=weekdayStats(mDates);const ts=timeStats(mDates);const suggestion=makeSuggestion(w,best,worst,fails,ts);const review=buildWeeklyReview(wDates,w,mo,stats,fails,wd,ts);lastWeeklyReviewText=review.text;document.getElementById('main').innerHTML=renderHero('리포트','루틴 데이터가 쌓일수록 다음 주 전략이 선명해집니다.')+`<section class="card"><div class="report-title">주간 회고 자동 생성</div><div class="grid3"><div class="stat-card"><b>${w.avg}%</b><span>성공률</span></div><div class="stat-card"><b>${money(w.totalEarned)}</b><span>총 적립액</span></div><div class="stat-card"><b>${money(w.transfers)}</b><span>DQ 이체액</span></div></div>${review.html}<div class="copy-row"><button class="btn btn-blue" id="copy-weekly-review">회고 복사</button><button class="btn btn-soft" id="refresh-weekly-review">다시 생성</button></div></section>`+

async function backupStateToGist(manual=false){if(!hasGistConfig()){if(manual)toast('Gist 정보를 저장해주세요.');return}if(autoSyncBusy){autoSyncQueued=true;return}autoSyncBusy=true;try{const data=await fetchGistData();const payload=(data&&typeof data==='object'&&!Array.isArray(data))?data:{};payload.routineTransfers=Array.isArray(payload.routineTransfers)?payload.routineTransfers:[];payload.dqLoopState=gistBackupState();payload.dqLoopBackupMeta={version:APP_VERSION,updatedAt:new Date().toISOString(),auto:true};await patchGistData(payload);state.gist.lastSync=new Date().toISOString();state.gist.lastAutoBackup=new Date().toISOString();state.gist.lastAutoBackupError='';persistLocal();if(manual)toast('Gist에 백업했습니다.');if(ui.tab==='settings')render()}catch(e){state.gist.lastAutoBackupError=e.message||String(e);persistLocal();if(manual)toast('Gist 백업 실패: '+state.gist.lastAutoBackupError);if(ui.tab==='settings')render()}finally{autoSyncBusy=false;if(autoSyncQueued){autoSyncQueued=false;scheduleAutoGistSync()}}}
async function transferToDQ(){const amount=walletBalance();if(amount<=0)return toast('이체할 잔고가 없습니다.');if(!state.gist.id||!state.gist.token)return toast('설정에서 Gist 정보를 저장해주세요.');const btn=document.getElementById('btn-transfer');if(btn){btn.disabled=true;btn.textContent='이체 요청 중...'}try{const data=await fetchGistData();data.routineTransfers=Array.isArray(data.routineTransfers)?data.routineTransfers:[];const entry={id:uid('dqloop'),source:'dq_loop',type:'routine_wallet_transfer',amount,currency:'KRW',status:'pending',createdAt:new Date().toISOString(),appliedAt:null,rewardedDays:deriveRewards().map(r=>r.date),memo:`DQ Loop 루틴 잔고 ${money(amount)}원 이체 요청`};data.routineTransfers.push(entry);data.dqLoopState=gistBackupState();data.dqLoopBackupMeta={version:APP_VERSION,updatedAt:new Date().toISOString(),reason:'transfer'};await patchGistData(data);state.transfers.push(entry);state.gist.lastSync=new Date().toISOString();state.gist.lastAutoBackup=new Date().toISOString();state.gist.lastAutoBackupError='';save({skipAutoSync:true});toast(`${money(amount)}원 DQ 이체 요청 완료`);render()}catch(e){toast('이체 실패: '+e.message);if(btn){btn.disabled=false;btn.textContent='DQ로 이체 요청'}}}

async function loadStateFromGist(){refreshGistConfigFromInputs();if(!hasGistConfig())return toast('Gist ID와 토큰을 입력해주세요.');if(!confirm('현재 로컬 DQ Loop 데이터를 Gist 백업으로 덮어쓸까요?'))return;const gistConfig=Object.assign({},state.gist);try{const data=await fetchGistData();const remoteState=extractDqLoopStateFromGistData(data);const next=normalizeState(JSON.parse(JSON.stringify(remoteState)));next.gist=Object.assign({},next.gist||{},gistConfig,{lastSync:new Date().toISOString(),lastAutoBackupError:''});state=next;persistLocal();toast('Gist 백업을 불러왔습니다.');render()}catch(e){state.gist.lastAutoBackupError=e.message||String(e);persistLocal();toast('Gist 불러오기 실패: '+state.gist.lastAutoBackupError);render()}}

function importJsonFile(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.routines||!data.completions)throw new Error('DQ Loop 백업 파일이 아닙니다.');state=normalizeState(data);save();toast('백업을 가져왔습니다.');render()}catch(e){toast('가져오기 실패: '+e.message)}};reader.readAsText(file)}
function bind(){document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){ui.tab=b.dataset.tab;render()}if(b.dataset.homeDate){ui.homeDate=b.dataset.homeDate;ui.deckIndex=0;render()}if(b.dataset.recDate){ui.recordDate=b.dataset.recDate;render()}if(b.dataset.toggle)toggleRoutine(b.dataset.date,b.dataset.toggle);if(b.dataset.deckPrev)moveDeck(-1);if(b.dataset.deckNext)moveDeck(1);if(b.dataset.deckComplete)completeRoutineFromDeck(b.dataset.date,b.dataset.deckComplete);if(b.dataset.deckFail)openFailure(b.dataset.date,b.dataset.deckFail);if(b.dataset.pauseRoutine)openPauseModal(b.dataset.date,b.dataset.pauseRoutine);if(b.dataset.editPause){const p=(state.routinePauses||[]).find(x=>x.id===b.dataset.editPause);if(p)openPauseModal(p.startDate,p.routineId,p.id)}if(b.dataset.endPause)endPause(b.dataset.endPause);if(b.dataset.editNumber)openNumberRecord(b.dataset.date,b.dataset.editNumber,isDone(b.dataset.date,b.dataset.editNumber)?false:true,false);if(b.dataset.fail)openFailure(b.dataset.date,b.dataset.fail);if(b.dataset.openRoutine)openRoutineModal(b.dataset.openRoutine);if(b.dataset.editRoutine)openRoutineModal(b.dataset.editRoutine);if(b.dataset.toggleActive){const r=state.routines.find(x=>x.id===b.dataset.toggleActive);if(r){r.active=r.active===false;save();toast(r.active?'활성화했습니다.':'비활성화했습니다.');render()}}if(b.dataset.openMode)openModeModal(b.dataset.openMode);if(b.dataset.modeRoutines)openModeRoutineManager(b.dataset.modeRoutines);if(b.dataset.editMode)openModeModal(b.dataset.editMode);if(b.dataset.cloneMode)openModeModal(b.dataset.cloneMode,true);if(b.dataset.modeDate)openModeDateModal(b.dataset.modeDate);if(b.dataset.moveRoutine){const scopeDate=b.dataset.moveDate||'';const scopeIds=scopeDate?activeRoutines(scopeDate).map(r=>r.id):orderedRoutines().map(r=>r.id);if(moveRoutineInScope(b.dataset.moveRoutine,Number(b.dataset.moveDir||0),scopeIds)){save();toast('루틴 순서를 변경했습니다.');render()}else{toast('더 이동할 수 없습니다.')}}if(b.id==='prev-month'){ui.calendarMonth.setMonth(ui.calendarMonth.getMonth()-1);renderRecords()}if(b.id==='next-month'){ui.calendarMonth.setMonth(ui.calendarMonth.getMonth()+1);renderRecords()}if(b.id==='btn-transfer')transferToDQ();if(b.id==='btn-sync-transfer')syncTransferStatus();if(b.id==='restore-default-routines')restoreDefaultRoutines();if(b.id==='save-gist'){state.gist.id=document.getElementById('gist-id').value.trim();state.gist.token=document.getElementById('gist-token').value.trim();state.gist.fileName=document.getElementById('gist-file').value.trim()||'dq-backup.json';state.gist.autoBackup=document.getElementById('gist-auto')?.classList.contains('on')!==false;save({skipAutoSync:true});toast('Gist 설정을 저장했습니다.');if(state.gist.autoBackup)backupStateToGist(true)}if(b.id==='backup-gist-now')backupStateToGist(true);if(b.id==='load-gist-now')loadStateFromGist();if(b.id==='gist-auto'){b.classList.toggle('on');state.gist.autoBackup=b.classList.contains('on');save({skipAutoSync:true});toast(state.gist.autoBackup?'자동저장을 켰습니다.':'자동저장을 껐습니다.');render()}if(b.id==='order-time'){resetRoutineOrderByTime();save();toast('시간순 자동정렬로 전환했습니다.');render()}if(b.id==='order-manual'){state.settings.routineOrderMode='manual';save();toast('수동 순서 유지로 전환했습니다.');render()}if(b.id==='copy-weekly-review'){copyText(lastWeeklyReviewText).then(()=>toast('주간 회고를 복사했습니다.')).catch(()=>toast('복사에 실패했습니다.'))}if(b.id==='refresh-weekly-review'){renderReports();toast('주간 회고를 다시 생성했습니다.')}if(b.id==='save-pause-settings'){state.settings.pauseDisplay=document.getElementById('pause-display').value;state.settings.pauseWeeklyAllowance=Number(document.getElementById('pause-allowance').value||3);state.settings.pauseRecoveryReward=Number(document.getElementById('pause-recovery-reward').value||0);state.settings.pauseMinActiveRatio=Number(document.getElementById('pause-min-ratio').value||50);save();toast('루틴 휴식 설정을 저장했습니다.');render()}if(b.id==='save-reward'){document.querySelectorAll('.reward-input').forEach(i=>state.settings[i.dataset.setting]=Number(i.value||0));save();toast('보상 정책을 저장했습니다.');render()}if(b.id==='save-weekday-modes'){document.querySelectorAll('.weekday-mode').forEach(s=>{if(s.value)state.weekdayModeDefaults[s.dataset.weekdayMode]=s.value;else delete state.weekdayModeDefaults[s.dataset.weekdayMode]});save();toast('요일 기본 모드를 저장했습니다.');render()}if(b.id==='export-json')exportJson();if(b.id==='import-json')document.getElementById('import-file').click();if(b.id==='reset-app'){if(confirm('DQ Loop 전용 데이터를 초기화할까요?')){localStorage.removeItem(KEY);state=defaultState();save();toast('초기화했습니다.');render()}}});document.getElementById('import-file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJsonFile(f);e.target.value=''})}
bind();save({skipAutoSync:true});render();if(state.migratedFromOld){toast('기존 루틴 데이터를 안전하게 이전했습니다.');delete state.migratedFromOld;save({skipAutoSync:true})}
})();
</script>
</body>
</html>
