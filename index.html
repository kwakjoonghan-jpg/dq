<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DQ</title>
<meta name="description" content="습관과 목표를 지킨 만큼 나에게 보상하는 보상 통장">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f0e8">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var s=JSON.parse(localStorage.getItem('dq_app_v1')||'{}'),t=(s.settings||{}).theme||'system';document.documentElement.dataset.theme=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f3f0e8;--paper:#fffdf8;--paper2:#faf7ef;--sunk:#ebe7dc;--ink:#1b1a17;--ink2:#56534b;--ink3:#8a8578;--line:#e3ded1;--line2:#cdc7b7;
 --accent:#1e6a48;--on-accent:#fff;--accent-soft:#e1eee5;--accent-line:#b9d6c3;
 --seal:#c23b22;--seal-soft:#f8e3dc;--gold:#94680f;--gold-soft:#f4ebd3;
 --bad:#b33a28;--bad-soft:#f7e3de;--warn:#8c6212;--warn-soft:#f3ead0;
 --c-red:#c2412d;--c-orange:#bd651a;--c-gold:#9c7412;--c-green:#2d7a4c;--c-teal:#1c7672;--c-blue:#2d60aa;--c-purple:#694dab;--c-pink:#ad4573;--c-slate:#5a6371;
 --r:14px;--r2:10px;--r3:8px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
 --lift:0 1px 0 rgba(40,30,10,.03),0 1px 3px rgba(40,30,10,.05);
 --pop:0 12px 40px rgba(30,25,15,.18);
 color-scheme:light}
html[data-theme=dark]{
 --bg:#131210;--paper:#1c1b18;--paper2:#201f1b;--sunk:#272520;--ink:#ede9de;--ink2:#b5b0a2;--ink3:#7f7a6d;--line:#2f2d28;--line2:#48453d;
 --accent:#7cc69d;--on-accent:#0d1f15;--accent-soft:#1c2e23;--accent-line:#2f5240;
 --seal:#e57a62;--seal-soft:#3b211a;--gold:#dcb45c;--gold-soft:#332912;
 --bad:#e88c79;--bad-soft:#3a211b;--warn:#d8ad58;--warn-soft:#33290f;
 --c-red:#e58472;--c-orange:#e0a061;--c-gold:#d8b45d;--c-green:#7cc69d;--c-teal:#6cc3be;--c-blue:#86a9e6;--c-purple:#ad98e4;--c-pink:#e08bb0;--c-slate:#a3abb8;
 --lift:none;--pop:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum';word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit;touch-action:manipulation}
button:disabled{opacity:.42;cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
summary{list-style:none}summary::-webkit-details-marker{display:none}
details[open]>summary .chev{transform:rotate(180deg)}
b,strong{font-weight:700}
svg{display:block}

/* ───────── 틀 ───────── */
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.bar{display:flex;align-items:center;gap:8px;padding:calc(12px + var(--sat)) 16px 8px 20px;min-height:58px;flex-shrink:0;background:var(--bg);position:relative;z-index:5}
.bar.scrolled{box-shadow:0 1px 0 var(--line)}
.bar h1{flex:1;min-width:0;font-size:22px;font-weight:750;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-back{width:36px;height:36px;margin-left:-10px;border-radius:9px;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar-back svg{width:24px;height:24px}
.balchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 9px;border-radius:17px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0;box-shadow:var(--lift)}
.balchip .ic{width:18px;height:18px;color:var(--gold)}
.balchip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08);border-color:var(--accent)}}
.iconbtn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);flex-shrink:0}
.iconbtn svg{width:20px;height:20px;stroke-width:2.2}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px calc(96px + var(--sab));scrollbar-width:none;overscroll-behavior:contain}
#main::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:50}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--ink3);font-size:11px;font-weight:550;position:relative}
.nav svg{width:23px;height:23px;stroke-width:1.6}
.nav button.on{color:var(--ink);font-weight:750}
.nav button.on svg{stroke-width:2.1}
.nav .badge{position:absolute;top:6px;left:calc(50% + 7px);min-width:8px;height:8px;border-radius:4px;background:var(--seal)}

/* ───────── 기본 블록 ───────── */
.ic{display:inline-flex;width:22px;height:22px;flex-shrink:0}
.ic svg{width:100%;height:100%}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.sec-h h2{font-size:16px;font-weight:750;letter-spacing:-.015em}
.sec-h h2 small{font-size:13px;font-weight:550;color:var(--ink3);margin-left:6px;letter-spacing:0}
.sec-sub{font-size:12.5px;color:var(--ink3);margin:-4px 0 10px}
.lnk{font-size:13.5px;font-weight:650;color:var(--accent);padding:6px 0 6px 12px;white-space:nowrap}
.lnk.mute{color:var(--ink3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.card.pad{padding:16px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;width:100%;position:relative}
.list>.row:first-child,.list>:first-child .row,.list>.row.first{border-top:0}
.row-main{flex:1;min-width:0}
button.row,button.row-main{text-align:left}
.row-t{font-size:15px;font-weight:600;line-height:1.35}
.row-s{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.row-v{font-size:14px;font-weight:650;white-space:nowrap;text-align:right}
.row-v small{display:block;font-size:11.5px;font-weight:500;color:var(--ink3)}
.chev{color:var(--ink3);width:18px;height:18px;flex-shrink:0}
.more{width:34px;height:38px;margin-right:-10px;border-radius:8px;color:var(--ink3);font-size:19px;line-height:1;letter-spacing:1px;text-align:center;flex-shrink:0}
.note{font-size:13px;color:var(--ink3);line-height:1.6}
.note b{color:var(--ink2);font-weight:650}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.65;padding:28px 18px}
.empty .ic{width:30px;height:30px;margin:0 auto 10px;color:var(--line2)}
.empty b{display:block;color:var(--ink2);font-size:15px;font-weight:650;margin-bottom:3px}
.empty .btn{margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:650;line-height:1;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--ink2);white-space:nowrap;vertical-align:1px}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.ink{background:var(--ink);color:var(--bg)}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gap{height:12px}.gap2{height:20px}
.hr{height:1px;background:var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flex{display:flex;gap:8px;align-items:center}
.flex1{flex:1;min-width:0}
.amt{font-weight:700;white-space:nowrap}
.amt.plus{color:var(--accent)}
.amt.minus{color:var(--ink)}
.muted{color:var(--ink3)}
.late{color:var(--bad)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:var(--paper);font-size:14.5px;font-weight:650;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.975)}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-a{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn-ghost{border-color:transparent;background:var(--sunk)}
.btn-s{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn-s svg{width:16px;height:16px}
.btn-full{width:100%}
.sq{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2)}
.sq svg{width:18px;height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{min-height:36px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--ink2);text-align:center;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--lift)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--paper);color:var(--ink2);border-radius:18px;padding:0 13px;min-height:34px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track.gold i{background:var(--gold)}
.track.ink i{background:var(--ink)}
.track.thick{height:9px;border-radius:5px}

/* 체크 */
.cb{width:30px;height:30px;border-radius:9px;border:1.6px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:16px;font-weight:700;line-height:1;position:relative;transition:background .15s,border-color .15s}
.cb:after{content:'';position:absolute;inset:-10px}
.cb svg{width:18px;height:18px;stroke-width:2.8}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb.x{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.cb.z{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);font-size:13px}
.cb.round{border-radius:50%}
.cb.pop svg{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.cb:disabled{opacity:.5}
.row.done .row-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2);text-decoration-thickness:1.5px}
.row.failed .row-t,.row.paused .row-t{color:var(--ink3)}
.row.done>.ic,.row.failed>.ic,.row.paused>.ic{opacity:.4}
.row.next{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.row.next:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rwd{font-size:12.5px;font-weight:700;color:var(--gold);white-space:nowrap}

/* ───────── 통장 카드 (홈) ───────── */
.passbook{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--lift);position:relative}
.pb-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 0;font-size:12px;font-weight:650;color:var(--ink3);letter-spacing:.02em}
.pb-head .ic{width:16px;height:16px;color:var(--gold);margin-right:5px}
.pb-bal{padding:4px 16px 0;font-size:38px;font-weight:780;letter-spacing:-.04em;line-height:1.15;display:flex;align-items:baseline;gap:3px}
.pb-bal small{font-size:20px;font-weight:650;letter-spacing:0}
.pb-delta{padding:2px 16px 14px;font-size:13px;color:var(--ink2)}
.pb-delta b{color:var(--accent)}
.pb-goal{display:flex;gap:12px;align-items:center;padding:12px 16px 14px;border-top:1px dashed var(--line2);background:var(--paper2);width:100%;text-align:left}
.pb-goal .jar{width:34px;height:44px;flex-shrink:0}
.pb-goal-t{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-goal-s{font-size:12px;color:var(--ink3);margin-top:1px}
.pb-goal .track{margin-top:7px}
.pb-goal-pct{font-size:17px;font-weight:750;white-space:nowrap}
.pb-empty{padding:12px 16px 14px;border-top:1px dashed var(--line2);background:var(--paper2);font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}

/* 날짜 띠 */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 8px}
.dayhead-t{font-size:14px;font-weight:650;color:var(--ink2)}
.modebtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink2);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;background:var(--paper)}
.modebtn .ic{width:16px;height:16px}
.week{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:2px;align-items:center}
.week-nav{height:44px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.week-nav svg{width:18px;height:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:10px}
.day .dw{font-size:11px;color:var(--ink3);font-weight:550}
.day .dd{font-size:15px;font-weight:650;width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%;position:relative}
.day.on .dd{background:var(--ink);color:var(--bg)}
.day.tdy .dw{color:var(--accent);font-weight:750}
.day .ring{position:absolute;inset:-3px;border-radius:50%}
.day .mk{width:5px;height:5px;border-radius:50%}
.day .mk.full{background:var(--accent)}
.day .mk.part{background:var(--accent);opacity:.35}
.day .mk.none{background:transparent}

/* 하루 미터 */
.meter-card{padding:14px 16px 12px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-num{font-size:30px;font-weight:780;letter-spacing:-.035em;line-height:1}
.meter-num span{font-size:17px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:3px}
.meter-goal{font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.4}
.meter-goal b{color:var(--gold)}
.meter{position:relative;margin:14px 0 4px;height:26px}
.meter-cells{display:flex;gap:3px;height:10px}
.meter-cells i{flex:1;border-radius:3px;background:var(--sunk);min-width:3px;transition:background .3s}
.meter-cells i.d{background:var(--accent)}
.meter-cells i.f{background:var(--bad);opacity:.5}
.meter-mark{position:absolute;top:-2px;height:14px;border-left:1.5px dashed var(--ink3)}
.meter-mark span{position:absolute;top:15px;left:-20px;width:40px;text-align:center;font-size:10.5px;font-weight:650;color:var(--ink3)}
.meter-mark.hit{border-color:var(--gold)}
.meter-mark.hit span{color:var(--gold)}

/* 지금 할 일 */
.focus{margin-top:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 16px}
.focus-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pager{display:inline-flex;align-items:center;gap:0;font-weight:550;color:var(--ink3);font-size:12.5px}
.pager button{width:32px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border-radius:7px}
.pager svg{width:16px;height:16px}
.focus-body{display:flex;gap:12px;align-items:flex-start;margin-top:6px}
.focus-body>.ic{width:28px;height:28px;margin-top:2px}
.focus-time{font-size:13px;color:var(--ink2);font-weight:550}
.focus-title{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.3;margin-top:1px}
.focus-meta{font-size:12.5px;color:var(--ink3);margin-top:4px}
.focus-act{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;margin-top:14px}
.clear{margin-top:12px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.clear>.ic{color:var(--accent);width:28px;height:28px}
.clear b{display:block;font-size:15px}
.clear span{font-size:12.5px;color:var(--ink2)}

/* 오늘의 3개 */
.picks{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
.picks-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--paper2);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.picks-h b{color:var(--gold)}
.pick-cta{display:flex;align-items:center;gap:12px;padding:16px;width:100%;text-align:left}
.pick-cta .slots{display:flex;gap:5px}
.pick-cta .slots i{width:22px;height:28px;border:1.5px dashed var(--line2);border-radius:6px}
.pick-num{width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2)}

/* 알림 카드 */
.notice{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);margin-top:12px;width:100%;text-align:left;box-shadow:var(--lift)}
.notice>.ic{width:26px;height:26px}
.notice.gold{border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft)}
.notice.gold>.ic{color:var(--gold)}
.notice.seal{border-left:3px solid var(--seal)}
.notice.seal>.ic{color:var(--seal)}
.notice b{display:block;font-size:14.5px}
.notice span{font-size:12.5px;color:var(--ink2)}

/* 빠른 입력 */
.quick{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.quick input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:8px 0}
.quick input::placeholder{color:var(--ink3)}
.quick .sq{border-color:transparent;background:var(--sunk)}

/* ───────── 목표 ───────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stats.c2{grid-template-columns:repeat(2,1fr)}
.stat{padding:13px 6px;text-align:center;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:19px;font-weight:750;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.goal{display:block;width:100%;text-align:left;padding:15px 16px;border-top:1px solid var(--line);position:relative}
.goal:first-child{border-top:0}
.goal{cursor:pointer}.goal:focus{outline:none}.goal:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal-t{font-size:16.5px;font-weight:720;letter-spacing:-.015em;line-height:1.35}
.goal-dd{font-size:13px;font-weight:750;white-space:nowrap;padding:3px 7px;border-radius:6px;background:var(--sunk)}
.goal-dd.near{background:var(--seal-soft);color:var(--seal)}
.goal-meta{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.goal-prog{display:flex;align-items:center;gap:10px;margin-top:11px}
.goal-prog .track{flex:1}
.goal-prog b{font-size:12.5px;font-weight:650;color:var(--ink2);white-space:nowrap}
.goal-next{display:flex;align-items:center;gap:10px;margin-top:11px;padding:9px 10px 9px 12px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.goal-next-t{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.goal-next-t small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.goal.dim{opacity:.6}
.goal.is-focus:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--seal)}
.hero{padding:6px 0 4px}
.hero-meta{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hero-why{font-size:15px;line-height:1.6;margin-top:10px}
.hero-big{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.hero-big b{font-size:42px;font-weight:780;letter-spacing:-.04em;line-height:1}
.hero-big span{font-size:14px;color:var(--ink3)}
.ms{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.ms:first-child{border-top:0}
.ms-line{position:absolute;left:28px;top:0;bottom:0;width:1.5px;background:var(--line)}
.ms .cb{z-index:1}
.ms.done .row-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.ms.cur{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.counter{display:flex;align-items:center;gap:14px}
.counter b{font-size:34px;font-weight:780;letter-spacing:-.03em}

/* ───────── 상점 ───────── */
.jar-card{display:flex;gap:16px;align-items:center;padding:16px}
.jar-card .jar{width:76px;height:98px;flex-shrink:0}
.jar-fill{fill:var(--gold);opacity:.85;transition:all .6s}
.jar-glass{fill:none;stroke:var(--ink2);stroke-width:2.2}
.jar-lid{fill:var(--ink2)}
.jar-glint{stroke:var(--paper);stroke-width:2.5;stroke-linecap:round;opacity:.7}
.jar-t{font-size:12px;color:var(--ink3);font-weight:650}
.jar-name{font-size:18px;font-weight:750;letter-spacing:-.02em;line-height:1.3;margin-top:2px}
.jar-nums{font-size:13px;color:var(--ink2);margin-top:6px}
.jar-pct{font-size:28px;font-weight:780;letter-spacing:-.03em;margin-top:2px}
.wish{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.wish:first-child{border-top:0}
.wish>.ic{width:24px;height:24px}
.wish-p{font-size:14.5px;font-weight:700;white-space:nowrap;text-align:right}
.wish-p small{display:block;font-size:11.5px;font-weight:550;color:var(--ink3)}
.wish .track{margin-top:7px;height:4px}
.wish.can .wish-p{color:var(--accent)}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trophy{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative;overflow:hidden;box-shadow:var(--lift)}
.trophy .ic{width:26px;height:26px;margin-bottom:4px}
.trophy-t{font-size:14px;font-weight:700;line-height:1.35}
.trophy-s{font-size:11.5px;color:var(--ink3)}
.trophy-p{font-size:13px;font-weight:700;margin-top:auto}
.trophy .mini-stamp{position:absolute;right:-6px;top:-6px;width:52px;height:52px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(14deg);opacity:.55}

/* ───────── 기록 ───────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.cal-title{font-size:17px;font-weight:750}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11px;color:var(--ink3);text-align:center;padding:4px 0;font-weight:600}
.cell{aspect-ratio:1/1.08;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border:1.5px solid transparent;min-width:0}
.cell .n{font-size:14px;font-weight:650}
.cell .p{font-size:10px;color:var(--ink3);line-height:1}
.cell.h1{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.cell.h2{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.cell.h3{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.cell.h3 .p,.cell.h3 .n{color:var(--ink)}
.cell.fut .n{color:var(--ink3);font-weight:500}
.cell.tdy .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell.on{border-color:var(--ink)}
.cell .pip{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%}
.cell .coin{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.legend{display:flex;gap:12px;align-items:center;justify-content:flex-end;font-size:11.5px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.wk-nav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:16px 0 12px;text-align:center}
.wk-nav b{display:block;font-size:16px}
.wk-nav span{font-size:12.5px;color:var(--ink3)}
.review h4{font-size:12.5px;font-weight:700;color:var(--ink3);margin:14px 0 3px}
.review h4:first-child{margin-top:0}
.review p{font-size:14px;line-height:1.7}
.bar-row{display:grid;grid-template-columns:minmax(56px,36%) 1fr 52px;gap:10px;align-items:center;padding:7px 0}
.bar-lbl{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar-val{text-align:right;font-size:12.5px;font-weight:650;color:var(--ink2);white-space:nowrap}
.chart{padding:14px;border-top:1px solid var(--line)}
.chart:first-child{border-top:0}
.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart-val{font-size:20px;font-weight:750;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.chart-delta{font-size:12px;text-align:right;color:var(--ink3)}
.chart svg{width:100%;height:auto;margin-top:8px;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.c-target{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4}
.c-txt{font-size:10px;fill:var(--ink3)}
.c-bar{fill:var(--accent)}
.c-bar.neg{fill:var(--ink3)}
/* 통장 내역 */
.led-month{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--paper2);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);font-weight:650}
.led-month:first-child{border-top:0}
.led{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.led-d{font-size:12.5px;color:var(--ink3);font-weight:550}
.led-t{font-size:14px;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis}
.led-t small{display:block;font-size:11.5px;color:var(--ink3);font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led-a{font-size:14.5px;font-weight:700;white-space:nowrap;text-align:right}
.led-a.plus{color:var(--accent)}

/* ───────── 폼 ───────── */
.field{margin-bottom:15px}
.field>label,.flabel{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:6px}
.input,.select,.textarea{width:100%;border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;min-height:46px;-webkit-appearance:none;appearance:none}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.textarea{min-height:80px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink)}
.input.big{font-size:22px;font-weight:700;min-height:56px}
.help{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:6px}
.inwrap{position:relative}
.inwrap .suf{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px;pointer-events:none}
.inwrap .input{padding-right:36px}
.dowpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dowpick .chip{padding:0;text-align:center;border-radius:9px}
.icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:172px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--paper)}
.icon-pick{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.icon-pick svg{width:22px;height:22px}
.icon-pick.on{border-color:var(--ink);background:var(--sunk)}
.colors{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.color-pick{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--paper);box-shadow:0 0 0 1px var(--line2)}
.color-pick.on{box-shadow:0 0 0 2px var(--ink)}
.box{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:var(--paper)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.box-h b{font-size:14.5px;font-weight:650}
.box-h small{display:block;font-size:12px;color:var(--ink3);font-weight:450;margin-top:1px}
.box-body{margin-top:12px}
.switch{position:relative;width:46px;height:28px;display:inline-block;flex-shrink:0}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:14px;transition:.18s;pointer-events:none}
.switch span:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt{border:1px solid var(--line2);background:var(--paper);border-radius:12px;padding:12px 13px;display:flex;gap:11px;align-items:center;width:100%;text-align:left}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt b{display:block;font-size:14.5px;font-weight:650}
.opt small{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.opt .ic{width:24px;height:24px}
.diffpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.diffpick button{border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:9px 4px;text-align:center}
.diffpick button b{display:block;font-size:15px}
.diffpick button span{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.diffpick button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mrow{padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.off .mrow-t{color:var(--ink3)}
.mrow-h{display:flex;align-items:center;gap:10px}
.mrow-t{flex:1;min-width:0;font-size:14px;font-weight:600}
.mrow-c{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px;align-items:center}
.mrow.off .mrow-c{display:none}
.ckl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.ckl input{width:18px;height:18px;accent-color:var(--accent)}
.edit-ms{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.edit-ms .input{min-height:42px;font-size:15px}
.edit-ms .input.r{width:96px;flex-shrink:0;text-align:right}

/* ───────── 시트 · 대화상자 ───────── */
.sheet-bg{position:fixed;inset:0;background:rgba(18,16,12,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;max-height:92dvh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.25,1);box-shadow:var(--pop);transition:transform .2s}
.sheet.dragging{transition:none}
.sheet-grab{padding:9px 0 3px;display:flex;justify-content:center;flex-shrink:0;cursor:grab;touch-action:none}
.sheet-grab i{width:38px;height:4.5px;border-radius:3px;background:var(--line2)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:8px 20px 0;flex-shrink:0}
.sheet-head h2{flex:1;font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.3}
.sheet-x{width:34px;height:34px;margin:-3px -8px 0 0;border-radius:9px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.sheet-x svg{width:22px;height:22px}
.sheet-sub{font-size:13.5px;color:var(--ink2);line-height:1.55;padding:4px 20px 0}
.sheet-body{padding:18px 20px calc(20px + var(--sab));overflow-y:auto;overscroll-behavior:contain}
.sheet-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:20px}
@media(min-width:600px){.sheet-bg{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:88dvh}.sheet-grab{display:none}}
.acts{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;font-size:15px;font-weight:550;border-top:1px solid var(--line);text-align:left}
.act:first-child{border-top:0}
.act svg{width:20px;height:20px;color:var(--ink3)}
.act.bad{color:var(--bad)}
.act.bad svg{color:var(--bad)}
.dialog-bg{position:fixed;inset:0;background:rgba(18,16,12,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
.dialog{width:100%;max-width:340px;background:var(--bg);border-radius:16px;padding:22px 20px 18px;animation:up .2s;box-shadow:var(--pop)}
.dialog-msg{font-size:16.5px;font-weight:700;line-height:1.45}
.dialog-sub{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:7px;white-space:pre-line}
.dialog .grid2{margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translate(-50%,14px);z-index:500;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 40px);width:max-content;display:flex;align-items:center;gap:10px;box-shadow:var(--pop)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .t-amt{font-size:17px;font-weight:800;color:var(--accent-soft)}
html[data-theme=dark] #toast .t-amt{color:var(--on-accent)}
#toast .t-sub{font-size:12px;opacity:.75;font-weight:500;display:block}
#toast .ic{width:20px;height:20px;color:var(--gold-soft)}

/* ───────── 연출 ───────── */
.fx{position:fixed;inset:0;z-index:600;pointer-events:none;display:flex;align-items:center;justify-content:center}
.stamp{width:168px;height:168px;border-radius:50%;border:5px double var(--seal);color:var(--seal);background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);animation:stamp 1.9s cubic-bezier(.2,.9,.3,1) forwards;text-align:center}
.stamp b{font-size:25px;font-weight:850;letter-spacing:.03em;line-height:1.15}
.stamp span{font-size:13px;font-weight:700;margin-top:4px}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.1)}13%{opacity:1;transform:rotate(-12deg) scale(.94)}19%{transform:rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-12deg) scale(1)}}
.coinfly{position:fixed;z-index:610;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px color-mix(in srgb,#fff 35%,transparent);pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.4,1),opacity .7s}
/* 영수증 */
.receipt-wrap{padding:6px 0 4px}
.receipt{background:var(--paper);max-width:320px;margin:0 auto;padding:26px 22px 24px;position:relative;
 -webkit-mask:radial-gradient(circle at 7px 0,transparent 5.5px,#000 6px) 0 0/14px 51% repeat-x,radial-gradient(circle at 7px 100%,transparent 5.5px,#000 6px) 0 100%/14px 51% repeat-x;
 mask:radial-gradient(circle at 7px 0,transparent 5.5px,#000 6px) 0 0/14px 51% repeat-x,radial-gradient(circle at 7px 100%,transparent 5.5px,#000 6px) 0 100%/14px 51% repeat-x;
 animation:print .7s cubic-bezier(.2,.9,.3,1)}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.receipt h3{text-align:center;font-size:13px;letter-spacing:.24em;color:var(--ink3);font-weight:700}
.receipt .r-title{text-align:center;font-size:19px;font-weight:780;margin-top:10px;line-height:1.35}
.receipt .r-date{text-align:center;font-size:12px;color:var(--ink3);margin-top:4px}
.r-line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0}
.r-line span{color:var(--ink2)}
.r-line b{font-weight:700}
.r-cut{border-top:1.5px dashed var(--line2);margin:12px 0}
.r-total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700}
.r-total b{font-size:22px;font-weight:800}
.receipt .r-stamp{position:absolute;right:12px;top:16px;width:82px;height:82px;border-radius:50%;border:3px double var(--seal);color:var(--seal);font-size:15px;font-weight:850;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);opacity:0;animation:rstamp .5s .65s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rstamp{0%{opacity:0;transform:rotate(-14deg) scale(1.8)}100%{opacity:.9;transform:rotate(-14deg) scale(1)}}
/* 봉투 */
.env{width:220px;height:150px;margin:10px auto 0;position:relative;perspective:600px}
.env-body{position:absolute;inset:0;background:var(--gold-soft);border:1.5px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:10px}
.env-flap{position:absolute;left:0;right:0;top:0;height:80px;transform-origin:top;transition:transform .5s;z-index:2}
.env-flap svg{width:100%;height:100%}
.env-card{position:absolute;left:18px;right:18px;top:20px;height:110px;background:var(--paper);border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .6s .25s cubic-bezier(.2,.9,.3,1);z-index:1}
.env-card b{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
.env-card span{font-size:12px;color:var(--ink3);font-weight:650}
.env.open .env-flap{transform:rotateX(180deg);z-index:0}
.env.open .env-card{transform:translateY(-62px);z-index:3}
.env-seal{position:absolute;left:50%;top:62px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--seal);z-index:3;transition:opacity .2s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.env.open .env-seal{opacity:0}

/* 온보딩 */
.ob{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ob-top{padding:calc(16px + var(--sat)) 20px 0;display:flex;gap:5px}
.ob-top i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ob-top i.on{background:var(--ink)}
.ob-body{flex:1;overflow-y:auto;padding:28px 20px 20px}
.ob-body h1{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.ob-body .lead{font-size:15px;color:var(--ink2);line-height:1.65;margin-top:10px}
.ob-foot{padding:12px 20px calc(16px + var(--sab));display:grid;gap:8px}
.ob-point{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.ob-point:first-child{border-top:0}
.ob-point .ic{width:26px;height:26px;margin-top:1px}
.ob-point b{display:block;font-size:15.5px}
.ob-point span{font-size:13.5px;color:var(--ink2);line-height:1.55}
.budget-big{font-size:40px;font-weight:800;letter-spacing:-.04em;text-align:center;margin:18px 0 4px}
.preview-table{font-size:13.5px}
.preview-table .r-line{padding:7px 0;border-top:1px solid var(--line)}
.preview-table .r-line:first-child{border-top:0}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:360px){#main{padding-left:14px;padding-right:14px}.bar{padding-left:14px;padding-right:12px}.chips.scroll{margin:0 -14px;padding:0 14px}.focus-act{grid-template-columns:1fr 1fr}.focus-act .btn-a{grid-column:1/3}.pb-bal{font-size:32px}.icon-grid{grid-template-columns:repeat(6,1fr)}.shelf{grid-template-columns:1fr}.balchip{font-size:13px;padding:0 9px 0 7px}}

function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function normTime(t){const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return'';return pad(Math.min(23,+m[1]))+':'+pad(Math.min(59,+m[2]))}

function short(n){n=Math.round(Number(n)||0);const a=Math.abs(n);if(a>=1e8)return(n/1e8).toFixed(a%1e8?1:0).replace(/\.0$/,'')+'억';if(a>=1e4)return(Math.round(n/1e3)/10).toString().replace(/\.0$/,'')+'만';return num(n)}

function guessArea(title,icon){
 const t=String(title||'')+' '+String(icon||'');
 if(/운동|헬스|러닝|달리|걷|산책|스트레칭|요가|체중|몸무게|식단|단백질|물 |물한|수면|취침|dumbbell|walk|bike|scale|bowl|apple|water|flame/.test(t))return'body';
 if(/명상|일기|감사|마음|호흡|회고|meditation|smile|heart/.test(t))return'mind';
 if(/공부|독서|책|강의|영어|스픽|자격|시험|피아노|악기|연습|학습|book|music|chat|code|pen/.test(t))return'learn';
 if(/업무|출근|보고|프로젝트|회사|일정|문서|briefcase|laptop/.test(t))return'work';
 if(/지출|소비|가계|투자|저축|돈|재무|card|coin|bank/.test(t))return'money';
 return'life';
}

function normalizeState(s){

function rewardsFromBudget(b){b=Math.max(10000,Number(b)||300000);const r=x=>nicePrice(b*x);

 const ratio={mode_normal:1,mode_holiday:.85,mode_light:.5,mode_emergency:.35};

/* ============================================================
   DQ · 계산 엔진 (습관, 하루 보상, 통장, 목표, 상점, 리포트)

/* ---------- 분야 · 모드 ---------- */
function areaById(id){return S.areas.find(a=>a.id===id)||{id:'',name:'기타',color:'slate',icon:'dot'}}
function defaultModeId(){return(S.modes.find(m=>m.isDefault)||S.modes[0]).id}
function modeById(id){return S.modes.find(m=>m.id===id)||S.modes.find(m=>m.isDefault)||S.modes[0]}
function modeFor(d){const o=S.modeOverrides[d];if(o&&S.modes.some(m=>m.id===o))return o;const w=S.weekdayModes[dow(d)];if(w&&S.modes.some(m=>m.id===w))return w;return defaultModeId()}
function hmode(h,mid){return Object.assign({on:true,time:'',reward:h.reward!==false},(h.modes||{})[mid]||{})}
function habitTime(h,d){return normTime(hmode(h,modeFor(d)).time)||h.time||''}
function habitLive(h,d){if(h.startDate&&d<h.startDate)return false;if(h.active!==false)return true;return!!(h.endedOn&&d<=h.endedOn)}

/* ---------- 습관 일정 ---------- */
function habitCmp(d){const manual=S.settings.orderMode==='manual';return(a,b)=>manual?(a.sort-b.sort||tmin(habitTime(a,d))-tmin(habitTime(b,d))):(tmin(habitTime(a,d))-tmin(habitTime(b,d))||a.sort-b.sort||a.title.localeCompare(b.title,'ko'))}
function orderedHabits(){return cached('oh',()=>[...S.habits].sort(habitCmp(today())))}
function scheduled(d){return cached('sc'+d,()=>{const mid=modeFor(d),w=dow(d);return S.habits.filter(h=>habitLive(h,d)&&h.days.includes(w)&&hmode(h,mid).on!==false).sort(habitCmp(d))})}
function pauseOf(hid,d){return S.pauses.find(p=>p.hid===hid&&d>=p.start&&d<=p.end)||null}
function activeHabits(d){return cached('ah'+d,()=>scheduled(d).filter(h=>!pauseOf(h.id,d)))}
function pausedHabits(d){return cached('ph'+d,()=>scheduled(d).map(h=>({h,p:pauseOf(h.id,d)})).filter(x=>x.p))}
function dayLog(d){if(!S.habitLog[d])S.habitLog[d]={done:{},fail:{}};return S.habitLog[d]}

function failOf(d,hid){const l=S.habitLog[d];return l&&l.fail[hid]||null}
function dayRate(d){return cached('dr'+d,()=>{
 if(d<S.since)return{done:0,fail:0,total:0,pct:0,paused:0};
 const list=activeHabits(d);const done=list.filter(h=>isDone(d,h.id)).length;const fail=list.filter(h=>failOf(d,h.id)).length;
 return{done,fail,total:list.length,pct:list.length?Math.round(done/list.length*100):0,paused:pausedHabits(d).length}})}
function dayReward(d){return cached('rw'+d,()=>{
 const mid=modeFor(d),mode=modeById(mid);
 const empty={amount:0,label:'',done:0,total:0,mode,need80:0,need100:0,recovery:false};
 if(d<S.since)return empty;
 const base=scheduled(d).filter(h=>hmode(h,mid).reward!==false);
 const list=base.filter(h=>!pauseOf(h.id,d));
 const done=list.filter(h=>isDone(d,h.id)).length,n=list.length,rate=n?done/n:0;
 const recovery=base.length>list.length&&base.length>0&&n/base.length<S.settings.minActiveRatio/100;
 let amount=0,label='';
 if(recovery&&n&&done===n){amount=S.settings.recoveryReward;label='회복일 습관 완료'}
 else if(n&&rate>=1){amount=mode.full;label='습관 100% 달성'}
 else if(n&&rate>=.8){amount=mode.partial;label='습관 80% 이상 달성'}
 return{amount,label,done,total:n,mode,recovery,need80:Math.max(0,Math.ceil(n*.8-1e-9)-done),need100:Math.max(0,n-done)}})}
function weeklyCount(h,d){const ws=weekStart(d);return range(ws,addDays(ws,6)).filter(x=>isDone(x,h.id)).length}
function timeState(d,h){if(d!==today()||isDone(d,h.id)||failOf(d,h.id))return'';const t=habitTime(h,d);if(!t)return'';const diff=tmin(t)-nowMin();if(diff<-30)return'late';if(diff<=60)return'soon';return''}
function habitStats(h,days){const t=today();const ds=range(addDays(t,-(days-1)),t).filter(d=>d>=S.since&&activeHabits(d).some(x=>x.id===h.id));const done=ds.filter(d=>isDone(d,h.id)).length;return{days:ds.length,done,pct:pct(done,ds.length)}}
function habitStreak(h){let s=0,d=today();if(!isDone(d,h.id))d=addDays(d,-1);for(let i=0;i<730&&d>=S.since;i++){if(activeHabits(d).some(x=>x.id===h.id)){if(!isDone(d,h.id))break;s++}d=addDays(d,-1)}return s}
function dayStreak(d){d=d||today();let s=0,x=d;if(x===today()&&dayRate(x).pct<100)x=addDays(x,-1);for(let i=0;i<2000&&x>=S.since;i++){const r=dayRate(x);if(r.total){if(r.pct<100)break;s++}x=addDays(x,-1)}return s}

 const n=Object.assign({at:nowISO(),note:'',areaId:'',ref:'',title:''},e);S.ledger.push(n);return n}

const SRC_LABEL={habitday:'습관',week:'주간 봉투',streak:'연속 달성',today3:'오늘의 3개',task:'할 일',ms:'목표 단계',goal:'목표 달성',manual:'직접 기록',buy:'보상 구매',dq:'이전 DQ',loop:'이전 DQ Loop'};

/* ---------- 정산 ---------- */
function settleDay(d,opt){if(!isDate(d)||d>today())return;C={};const r=dayReward(d);
 upsertLedger({id:'hd_'+d,kind:'earn',src:'habitday',date:d,amount:r.amount,title:r.label?(r.label+' · '+r.mode.name):'',ref:d});
 if(!(opt&&opt.bulk)){settleWeek(weekStart(d));settleStreaks(d)}}
function settleRange(a,b){const t=today();if(b>t)b=t;if(a<S.since)a=S.since;const days=range(a,b);days.forEach(d=>settleDay(d,{bulk:true}));const weeks=[...new Set(days.map(weekStart))];weeks.forEach(settleWeek);if(days.length)settleStreaks(days[0])}
function envMult(ws){const r=hash(ws+'|'+S.createdAt);return r<.05?3:r<.15?2:r<.4?1.5:1}
function envAmount(env){return round100(env.base*env.mult)}

 const days=range(ws,addDays(ws,6));const hits=days.filter(d=>lget('hd_'+d));let env=S.envelopes[ws];
 const eligible=hits.length>=5&&(S.settings.weeklyBonus>0||(env&&env.imported));
 if(eligible){
  if(!env)env=S.envelopes[ws]={base:S.settings.weeklyBonus,mult:envMult(ws),openedAt:''};
  if(env.openedAt)upsertLedger({id:'wk_'+ws,kind:'earn',src:'week',date:env.imported?hits[hits.length-1]:isoDate(env.openedAt),amount:envAmount(env),title:'주간 보너스 봉투'+(env.mult>1?' ('+env.mult+'배)':''),ref:ws});

}
function unopenedEnvelopes(){return Object.keys(S.envelopes).filter(ws=>{const e=S.envelopes[ws];return e&&!e.openedAt&&range(ws,addDays(ws,6)).filter(d=>lget('hd_'+d)).length>=5}).sort()}
function openEnvelope(ws){const env=S.envelopes[ws];if(!env||env.openedAt)return null;env.openedAt=nowISO();settleWeek(ws);return env}
function settleStreaks(from){
 const t=today(),sf=S.settings.streakFrom||t,bonus=Number(S.settings.streakBonus)||0;
 const old={};S.ledger.forEach(e=>{if(e.src==='streak')old[e.id]=e.amount});

  if(r.pct===100){run++;if(run%7===0&&d>=from)upsertLedger({id:'st_'+d,kind:'earn',src:'streak',date:d,amount:old['st_'+d]||bonus,title:run+'일 연속 습관 100%',ref:d})}
  else if(d!==t)run=0})}

/* ---------- 할 일 · 목표 ---------- */

 if(t.repeat.on){const i=logId?t.log.findIndex(x=>x.id===logId):t.log.length-1;if(i<0)return;const x=t.log[i];removeLedger(x.lid);t.log.splice(i,1);settlePicks(x.date);return}

function periodStats(a,b){const t=today();const dates=range(a,b).filter(d=>d>=S.since&&(d<t||(d===t&&dayRate(t).total&&dayRate(t).pct===100)));
 const act=dates.filter(d=>dayRate(d).total);const avg=act.length?Math.round(act.reduce((s,d)=>s+dayRate(d).pct,0)/act.length):0;

function habitTable(dates){return S.habits.map(h=>{let n=0,done=0,fail=0;dates.forEach(d=>{if(activeHabits(d).some(x=>x.id===h.id)){n++;if(isDone(d,h.id))done++;else if(failOf(d,h.id))fail++}});return{h,n,done,fail,miss:n-done,pct:pct(done,n)}}).filter(x=>x.n)}

function slotTable(dates){const m={};dates.forEach(d=>activeHabits(d).forEach(h=>{const s=timeSlot(habitTime(h,d));m[s]=m[s]||{n:0,done:0};m[s].n++;if(isDone(d,h.id))m[s].done++}));return['아침','오후','저녁','시간 미정'].filter(k=>m[k]).map(k=>({name:k,n:m[k].n,pct:pct(m[k].done,m[k].n)}))}
function failTable(dates){const m={};dates.forEach(d=>{const l=S.habitLog[d];if(!l)return;Object.values(l.fail).forEach(f=>{const r=f.reason||'기타';m[r]=(m[r]||0)+1})});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function pauseCount(dates){let n=0;dates.forEach(d=>{n+=pausedHabits(d).length});return n}

function buildReview(ws,label){
 const we=addDays(ws,6),st=periodStats(ws,we),tb=habitTable(st.dates),fails=failTable(st.dates),pz=pauseCount(st.dates);
 const best=[...tb].sort((a,b)=>b.pct-a.pct||b.done-a.done)[0],worst=[...tb].filter(x=>x.miss>0).sort((a,b)=>a.pct-b.pct||b.miss-a.miss)[0];
 const wd=weekdayTable(st.dates).filter(x=>x.n),weakDay=[...wd].sort((a,b)=>a.avg-b.avg)[0],sl=slotTable(st.dates),weakSlot=[...sl].sort((a,b)=>a.pct-b.pct)[0];
 const good=st.act.length?(st.avg>=80?`평균 ${st.avg}%로 흐름을 지켰습니다. 습관을 전부 마친 날이 ${st.full}일입니다.`:`평균 ${st.avg}%입니다. 전부 마친 날 ${st.full}일을 기준점으로 삼으면 됩니다.`)+(best?` 가장 잘 지킨 습관은 '${best.h.title}'(${best.pct}%)입니다.`:''):'기록된 습관이 없습니다.';
 const bad=worst?`'${worst.h.title}'${josa(worst.h.title,'이','가')} ${worst.miss}번 빠졌습니다.`+(fails.length?` 놓친 이유는 ${fails.slice(0,3).map(x=>x[0]+' '+x[1]+'회').join(', ')} 순입니다.`:'')+(pz?` 쉬어가기는 ${pz}회였습니다.`:''):'크게 흔들린 습관은 없습니다.'+(pz?` 쉬어가기는 ${pz}회였습니다.`:'');
 let next;

 else if(weakDay&&weakDay.avg<70)next=`${weakDay.name}요일 달성률이 ${weakDay.avg}%로 낮습니다. 그날은 미리 가벼운 모드로 바꿔 두는 것을 권합니다.`;
 else if(worst)next=`'${worst.h.title}'${josa(worst.h.title,'을','를')} 가장 먼저 챙겨 보세요. 시간이나 요일을 조정하면 지키기 쉬워집니다.`;

 const rate=list.length?done/list.length:0,minR=Number((L.settings||{}).pauseMinActiveRatio||50)/100;const rec=base.length>list.length&&base.length&&list.length/base.length<minR;
 let amount=0;

 const meta=[`${areaDot(g.areaId)}${esc(a.name)}`,GOAL_STATUS[g.status],`${g.diff} · ${DIFF_LABEL[g.diff]}`,due?`${ymd(due)} (${dday(due)})`:''].filter(Boolean).join(' · ');

function migSummary(r){const L=(a,b)=>`<div class="r-line"><span>${a}</span><b>${b}</b></div>`;let h='';

/* ---------- 습관 체크 흐름 ---------- */
function habitFeedback(d,h,prev,el){
 const now=dayReward(d),r=dayRate(d),bal=balance(),gain=bal-prev.bal;
 if(gain>0)coinFly(el);
 if(now.amount>prev.amount&&r.pct===100&&now.amount>0){stampFx('전부 완료','+'+num(now.amount)+'원');
  const extra=gain-(now.amount-prev.amount);if(extra>0)setTimeout(()=>toast('연속 달성 보너스',{amount:extra}),1900);return}
 if(now.amount>prev.amount){toast(now.label+' · '+now.mode.name,{amount:gain});return}
 if(r.pct===100&&r.total){stampFx('전부 완료',md(d));return}
 toast(`${h.title} 완료 · ${r.done}/${r.total}`);vib(20)}
function snap(d){return{amount:dayReward(d).amount,bal:balance()}}
function habitDone(d,id,el){const h=S.habits.find(x=>x.id===id);if(!h||d>today())return;if(isDone(d,id))return;
 if(h.number.on&&!(S.habitLog[d]&&S.habitLog[d].done[id])){numberSheet(d,id,true,el);return}
 const prev=snap(d);const L=dayLog(d);delete L.fail[id];L.done[id]={at:nowISO()};const hadEnv=unopenedEnvelopes().length;settleDay(d);save();
 ui.deck=Math.max(0,Math.min(ui.deck,activeHabits(d).filter(x=>!isDone(d,x.id)&&!failOf(d,x.id)).length-1));render();habitFeedback(d,h,prev,el);
 if(unopenedEnvelopes().length>hadEnv)setTimeout(()=>toast('주간 보너스 봉투가 도착했어요'),2200)}
function habitUndo(d,id){const L=S.habitLog[d];if(!L)return;delete L.done[id];settleDay(d);save();render();toast('완료 표시를 취소했어요')}
function habitToggle(d,id,el){if(isDone(d,id))habitUndo(d,id);else if(failOf(d,id)){delete dayLog(d).fail[id];settleDay(d);save();render();toast('못 함 기록을 지웠어요')}else habitDone(d,id,el)}
function numberSheet(d,id,markDone,el){const h=S.habits.find(x=>x.id===id);if(!h)return;const old=(S.habitLog[d]||{done:{}}).done[id]||{};const u=h.number.unit;
 openSheet({title:esc(h.number.label||'숫자')+' 기록',sub:esc(h.title)+' · '+mdK(d),focus:'nm-v',body:`<div class="field"><label for="nm-v">${esc(h.number.label||'값')}${u?' ('+esc(u)+')':''}</label><input class="input big" id="nm-v" type="number" step="any" inputmode="decimal" value="${old.v!=null&&old.v!==''?esc(old.v):''}" placeholder="숫자">${h.number.target!==''?`<p class="help">목표 ${esc(h.number.target)}${u?' '+esc(u):''}</p>`:''}</div><div class="field"><label for="nm-n">메모 (선택)</label><input class="input" id="nm-n" value="${esc(old.note||'')}" placeholder="예: 공복, 운동 후" maxlength="100"></div><div class="sheet-foot"><button class="btn" id="nm-skip">${markDone?'숫자 없이 완료':'취소'}</button><button class="btn btn-p" id="nm-ok">${markDone?'기록하고 완료':'저장'}</button></div>`});
 const fin=(v)=>{const prev=snap(d);const L=dayLog(d);const was=!!L.done[id];delete L.fail[id];L.done[id]=Object.assign({at:old.at||nowISO()},v);settleDay(d);save();closeSheet();render();if(markDone&&!was)habitFeedback(d,h,prev,el);else toast('기록했어요')};
 $('nm-ok').onclick=()=>{const raw=$('nm-v').value,v=Number(raw);if(raw===''||!Number.isFinite(v))return toast('숫자를 입력해 주세요');fin({v,note:$('nm-n').value.trim()})};
 $('nm-skip').onclick=()=>{if(markDone)fin({note:$('nm-n').value.trim()});else closeSheet()}}
function habitMenu(d,id){const h=S.habits.find(x=>x.id===id);if(!h)return;const p=pauseOf(id,d),done=isDone(d,id),f=failOf(d,id),fut=d>today(),st=habitStats(h,30),sk=habitStreak(h);
 const items=[];
 if(p){items.push({a:'pause-end',icon:'play',label:'지금 다시 시작',data:{id:p.id}});items.push({a:'pause-edit',icon:'edit',label:'쉬는 기간 바꾸기',data:{id:p.id}})}
 else if(!fut){if(!done)items.push({a:'habit-done',icon:'check',label:'완료',data:{id,date:d}});else items.push({a:'habit-undo',icon:'undo',label:'완료 취소',data:{id,date:d}});
  items.push({a:'habit-fail',icon:'x',label:f?'못 한 이유 바꾸기':'못 했어요 (이유 남기기)',data:{id,date:d}});if(f)items.push({a:'habit-unfail',icon:'undo',label:'못 함 기록 지우기',data:{id,date:d}});
  items.push({a:'habit-pause',icon:'pause',label:'쉬어가기',data:{id,date:d}});if(h.number.on&&done)items.push({a:'habit-number',icon:'edit',label:esc(h.number.label||'숫자')+' 고치기',data:{id,date:d}})}
 else items.push({a:'habit-pause',icon:'pause',label:'이날 미리 쉬어가기',data:{id,date:d}});
 items.push({a:'habit-edit',icon:'settings',label:'습관 수정',data:{id}});
 openSheet({title:esc(h.title),sub:`${tLabel(habitTime(h,d))||'시간 미정'} · 최근 30일 ${st.pct}% · 연속 ${sk}일`,body:actionList(items)})}
function failSheet(d,id){const h=S.habits.find(x=>x.id===id),old=failOf(d,id)||{};
 openSheet({title:'못 한 이유',sub:esc(h.title)+' · 이유를 남기면 주간 리포트에서 패턴을 찾아 드려요.',body:choice(FAIL_REASONS,old.reason||'','fr')+`<div class="field" style="margin-top:14px"><label for="fr-n">메모 (선택)</label><textarea class="textarea" id="fr-n" placeholder="짧게 남겨 두세요" maxlength="200">${esc(old.note||'')}</textarea></div>`+foot('fr-ok','기록')});
 const get=bindChoice('fr',old.reason||'');

let syncTimer=null,syncBusy=false,syncAgain=false;
function scheduleSync(){if(!hasGist()||!S.gist.auto)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>gistPush(false),1500)}
function exportCopy(){const c=JSON.parse(JSON.stringify(S));c.gist.token='';c.gist.err='';return c}
function exportFile(){const blob=new Blob([JSON.stringify(exportCopy(),null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dq-app-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('백업 파일을 저장했어요')}
async function gh(method,body){const r=await fetch('https://api.github.com/gists/'+encodeURIComponent(S.gist.id),{method,cache:'no-store',headers:Object.assign({Authorization:'token '+S.gist.token,Accept:'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 if(r.status===401)throw new Error('토큰이 올바르지 않습니다');if(r.status===403)throw new Error('토큰 권한이나 요청 한도를 확인해 주세요');if(r.status===404)throw new Error('Gist를 찾을 수 없습니다');if(!r.ok)throw new Error('GitHub 응답 오류 ('+r.status+')');return r.json()}
async function gistFile(name){const g=await gh('GET');const f=g.files&&g.files[name];if(!f)return null;let c=f.content;if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url);if(!r.ok)throw new Error('Gist 파일을 읽지 못했습니다');c=await r.text()}try{return JSON.parse(c||'null')}catch(e){throw new Error(name+' 파일 형식이 올바르지 않습니다')}}
async function gistPush(manual){if(!hasGist()){if(manual)toast('Gist ID와 토큰을 먼저 저장해 주세요');return}if(syncBusy){syncAgain=true;return}syncBusy=true;
 try{await gh('PATCH',{files:{[S.gist.file||'dq-app.json']:{content:JSON.stringify(exportCopy())}}});S.gist.last=nowISO();S.gist.err='';persist();if(manual)toast('Gist에 백업했어요')}
 catch(e){S.gist.err=e.message||String(e);persist();if(manual)toast('백업 실패: '+S.gist.err)}
 finally{syncBusy=false;if(ui.tab==='settings'&&ui.setView==='backup'&&!sheetOpen())render();if(syncAgain){syncAgain=false;scheduleSync()}}}
function readGistInputs(){const i=$('g-id'),t=$('g-token'),f=$('g-file'),a=$('g-auto');if(i)S.gist.id=i.value.trim();if(t)S.gist.token=t.value.trim();if(f)S.gist.file=f.value.trim()||'dq-app.json';if(a)S.gist.auto=a.checked}

 try{const remote=await gistFile(S.gist.file);if(remote&&remote.v===1&&Array.isArray(remote.ledger)&&String(remote.updatedAt||'')>String(S.updatedAt||'')&&remote.ledger.length>S.ledger.length){
   if(await ask('Gist에 더 최근 기록이 있어요. 불러올까요?',{detail:`Gist 통장 ${remote.ledger.length}건 · 이 기기 ${S.ledger.length}건\n불러오면 이 기기의 기록이 Gist 내용으로 바뀝니다.`,ok:'불러오기',no:'이 기기 기록 유지'})){adopt(remote);toast('Gist 기록을 불러왔어요');return render()}}
  toast('연결했어요');await gistPush(true)}catch(e){S.gist.err=e.message;persist();toast('연결 실패: '+e.message)}render()}
function adopt(data){const keep=Object.assign({},S.gist);const n=normalizeState(data);if(!n.gist.token){n.gist.token=keep.token;n.gist.id=n.gist.id||keep.id}n.onboarded=true;S=n;C={};persist();applyTheme();ui.lastBal=null}
async function gistPull(){readGistInputs();if(!hasGist())return toast('Gist ID와 토큰을 입력해 주세요');
 try{const remote=await gistFile(S.gist.file);if(!remote||remote.v!==1){const old=await gistFile('dq-backup.json').catch(()=>null);if(old&&(old.quests||old.dqLoopState)){if(await ask('이전 DQ 백업을 찾았어요. 가져올까요?',{detail:'Gist의 dq-backup.json에 이전 DQ와 DQ Loop 기록이 있습니다.',ok:'가져오기 화면으로'})){addMigSource(sniff(old),'Gist');migSheet()}return}return toast('Gist에 이 앱의 백업이 없어요')}
  if(!(await ask('Gist 백업으로 되살릴까요?',{detail:`Gist 통장 ${remote.ledger.length}건 · 마지막 저장 ${remote.updatedAt?new Date(remote.updatedAt).toLocaleString('ko-KR'):'알 수 없음'}\n이 기기의 지금 기록은 바뀝니다.`,ok:'되살리기',danger:true})))return;
  adopt(remote);S.gist.last=nowISO();S.gist.err='';persist();toast('되살렸어요');render()}catch(e){S.gist.err=e.message;persist();toast('불러오기 실패: '+e.message);render()}}

 'shop-sort'(el){ui.shopSort=el.value;render()},
 'habit-active'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;h.active=el.checked;h.endedOn=h.active?'':addDays(today(),-1);settleDay(today());save();render();toast(h.active?'다시 켰어요':'껐어요. 지난 기록은 남습니다')},
 'weekday-mode'(el){if(el.value)S.weekdayModes[el.dataset.dow]=el.value;else delete S.weekdayModes[el.dataset.dow];settleDay(today());save();render();toast(DOW[el.dataset.dow]+'요일 모드를 바꿨어요')},
 'day-start'(el){S.settings.dayStart=clamp(Number(el.value),0,6);save();ui.date=today();render();toast('하루가 바뀌는 시각을 정했어요')},
 haptics(el){S.settings.haptics=el.checked;save()}
};
const INPUT={'shop-q':v=>{ui.shopQ=v},'led-q':v=>{ui.ledQ=v;ui.ledMore=false}};
let inputT=null;
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();return Promise.resolve()}
function bind(){
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.tagName==='A')return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();try{f(b.dataset,b)}catch(err){console.error(err);toast('문제가 생겼어요: '+(err.message||err))}});
 document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CH[el.dataset.c])CH[el.dataset.c](el)});
 document.addEventListener('input',e=>{const el=e.target.closest('[data-c]');if(!el||!INPUT[el.dataset.c])return;INPUT[el.dataset.c](el.value);clearTimeout(inputT);inputT=setTimeout(()=>{ui.focusC=el.dataset.c;render()},280)});
 document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(f.dataset.form==='quick-task'){const i=f.querySelector('input');quickTask(i.value,f.dataset.date)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialogOpen()){const n=$('ask-no');if(n)n.click()}else closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
 $('file-in').addEventListener('change',e=>{const f=e.target.files[0];if(f)onFile(f);e.target.value=''});
 $('main').addEventListener('scroll',()=>{$('bar').classList.toggle('scrolled',$('main').scrollTop>4)},{passive:true});
 const typing=()=>{const a=document.activeElement;return!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value)};
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetOpen()&&!dialogOpen()&&!typing()&&S.onboarded)render()});
 try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
 setInterval(()=>{if(document.hidden||sheetOpen()||dialogOpen()||typing()||!S.onboarded||$('ob-root').firstChild)return;if(today()!==ui.lastDay||ui.tab==='today')render()},60000);
 window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue&&!sheetOpen()){S=loadState();C={};render()}})}
function boot(){S=loadState();resetUi();applyTheme();$$('[data-nav-icon]').forEach(el=>el.innerHTML=svg(el.dataset.navIcon));bind();
 if(!S.onboarded){render();obStart()}else{render()}
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();

})();
</script>
</body>
